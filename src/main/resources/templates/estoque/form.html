<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Cadastro de Estoque - PetX</title>

</head>
<body>
<div th:fragment="content">
    <div class="container-fluid">
        <!-- Cabeçalho com breadcrumb -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="text-primary mb-0">
                    <i class="fas fa-warehouse"></i> <span th:text="${estoque.id != null ? 'Editar' : 'Novo'} + ' Estoque'">Novo Estoque</span>
                </h2>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="/home">Dashboard</a></li>
                        <li class="breadcrumb-item"><a href="/estoque">Estoques</a></li>
                        <li class="breadcrumb-item active" th:text="${estoque.id != null ? 'Editar' : 'Novo'} + ' Estoque'">Novo Estoque</li>
                    </ol>
                </nav>
            </div>
            <div>
                <a href="/estoque" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left"></i> Voltar
                </a>
            </div>
        </div>

        <!-- Alertas -->
        <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i><span th:text="${sucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Card do formulário -->
        <div class="container-max card shadow mb-4 w-50">
            <div class="card-header py-3 d-flex align-items-center justify-content-between bg-primary text-white">
                <h6 class="m-0 font-weight-bold">Dados do Estoque</h6>
            </div>
            <div class="card-body">
                <form th:action="@{/estoque/salvar}" method="post" th:object="${estoque}">
                    <!-- Campo ID oculto para edição -->
                    <input type="hidden" th:field="*{id}" />

                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome do Estoque <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nome" th:field="*{nome}" required
                               placeholder="Ex: Estoque Principal, Estoque Filial">
                        <small th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="text-danger"></small>
                    </div>

                    <div class="mb-3">
                        <label for="nome" class="form-label">Descricao <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="descricao" th:field="*{descricao}" required
                               placeholder="Ex: Medicamentos, Higiene">
                        <small th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}" class="text-danger"></small>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-end">
                        <a href="/estoque" class="btn btn-outline-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i> Salvar Estoque
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
