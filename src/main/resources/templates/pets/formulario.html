<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Novo Pet - PetX</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Cadastro de Novo Pet</h2>
        <a href="/pets" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-2"></i>Voltar à Lista
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-triangle me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">Informações do Pet</h5>
        </div>
        <div class="card-body">
            <!-- Formulário tradicional com POST -->
            <form th:action="@{/pets/salvar}" method="post">
                <div class="row">
                    <!-- Informações básicas -->
                    <div class="col-md-6">
                        <h6 class="mb-3 text-primary">Dados Básicos</h6>

                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome do Pet *</label>
                            <input type="text" class="form-control" id="nome" name="nome" required>
                        </div>

                        <div class="mb-3">
                            <label for="especie" class="form-label">Espécie *</label>
                            <select class="form-select" id="especie" name="especie" required>
                                <option value="">Selecione a espécie</option>
                                <option value="cao">Cão</option>
                                <option value="gato">Gato</option>
                                <option value="ave">Ave</option>
                                <option value="roedor">Roedor</option>
                                <option value="reptil">Réptil</option>
                                <option value="peixe">Peixe</option>
                                <option value="outros">Outros</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="raca" class="form-label">Raça</label>
                            <input type="text" class="form-control" id="raca" name="raca" placeholder="Ex: Golden Retriever">
                        </div>

                        <div class="mb-3">
                            <label for="sexo" class="form-label">Sexo</label>
                            <select class="form-select" id="sexo" name="sexo">
                                <option value="">Selecione o sexo</option>
                                <option value="macho">Macho</option>
                                <option value="femea">Fêmea</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="dataNascimento" class="form-label">Data de Nascimento</label>
                            <input type="date" class="form-control" id="dataNascimento" name="dataNascimento">
                        </div>
                    </div>

                    <!-- Informações físicas -->
                    <div class="col-md-6">
                        <h6 class="mb-3 text-primary">Características Físicas</h6>

                        <div class="mb-3">
                            <label for="cor" class="form-label">Cor/Pelagem</label>
                            <input type="text" class="form-control" id="cor" name="cor" placeholder="Ex: Dourado, Preto e branco">
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="peso" class="form-label">Peso (kg)</label>
                                    <input type="number" class="form-control" id="peso" name="peso" step="0.1" min="0">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="altura" class="form-label">Altura (cm)</label>
                                    <input type="number" class="form-control" id="altura" name="altura" min="0">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="microchip" class="form-label">Número do Microchip</label>
                            <input type="text" class="form-control" id="microchip" name="microchip">
                        </div>

                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" name="status">
                                <option value="ativo" selected>Ativo</option>
                                <option value="inativo">Inativo</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Informações do proprietário -->
                <hr class="my-4">
                <h6 class="mb-3 text-primary">Informações do Proprietário</h6>

                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="nomeProprietario" class="form-label">Nome do Proprietário *</label>
                            <input type="text" class="form-control" id="nomeProprietario" name="nomeProprietario" required>
                        </div>

                        <div class="mb-3">
                            <label for="telefoneProprietario" class="form-label">Telefone *</label>
                            <input type="tel" class="form-control" id="telefoneProprietario" name="telefoneProprietario" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="emailProprietario" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="emailProprietario" name="emailProprietario">
                        </div>

                        <div class="mb-3">
                            <label for="enderecoProprietario" class="form-label">Endereço</label>
                            <textarea class="form-control" id="enderecoProprietario" name="enderecoProprietario" rows="2"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Observações -->
                <hr class="my-4">
                <div class="mb-3">
                    <label for="observacoes" class="form-label">Observações</label>
                    <textarea class="form-control" id="observacoes" name="observacoes" rows="3"
                              placeholder="Informações adicionais sobre o pet, alergias, medicamentos, etc."></textarea>
                </div>

                <!-- Botões de ação -->
                <div class="d-flex gap-2 justify-content-end">
                    <a href="/pets" class="btn btn-secondary">
                        <i class="fas fa-times me-2"></i>Cancelar
                    </a>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save me-2"></i>Salvar Pet
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
