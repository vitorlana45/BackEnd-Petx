<th:block xmlns:th="http://www.thymeleaf.org">

<!-- ============================================================================ -->
<!-- COMPONENTS - CARDS - Componentes de cards reutilizáveis                   -->
<!-- ============================================================================ -->

<!-- Card de Estatística -->
<div th:fragment="stat-card(icon, value, label, color, trend)" 
     class="card stat-card h-100" 
     data-aos="fade-up">
    <div class="card-body">
        <div class="stat-card-content">
            <div class="stat-icon-wrapper">
                <div th:class="${'stat-icon bg-' + color + '-subtle text-' + color}">
                    <i th:class="${'fas fa-' + icon}" aria-hidden="true"></i>
                </div>
            </div>
            <div class="stat-content">
                <h3 class="stat-value" th:text="${value}">0</h3>
                <p class="stat-label mb-0" th:text="${label}">Label</p>
                <div th:if="${trend}" class="stat-trend">
                    <i th:class="${trend.isPositive ? 'fas fa-arrow-up text-success' : 'fas fa-arrow-down text-danger'}" 
                       aria-hidden="true"></i>
                    <span th:text="${trend.percentage + '%'}" 
                          th:class="${trend.isPositive ? 'text-success' : 'text-danger'}">0%</span>
                    <small class="text-muted ms-1">vs. mês anterior</small>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Card de Ação -->
<div th:fragment="action-card(title, description, link, icon, color)" 
     class="card action-card h-100" 
     data-aos="fade-up">
    <div class="card-body d-flex flex-column">
        <div class="action-card-icon mb-3">
            <div th:class="${'action-icon bg-' + (color ?: 'primary') + '-subtle text-' + (color ?: 'primary')}">
                <i th:class="${'fas fa-' + icon}" aria-hidden="true"></i>
            </div>
        </div>
        <h5 class="card-title" th:text="${title}">Título</h5>
        <p class="card-text text-muted flex-grow-1" th:text="${description}">Descrição</p>
        <div class="mt-auto">
            <a th:href="${link}" class="btn btn-sm btn-outline-primary">
                Acessar <i class="fas fa-arrow-right ms-1"></i>
            </a>
        </div>
    </div>
</div>

<!-- Card de Animal -->
<div th:fragment="animal-card(animal)" 
     class="card animal-card h-100" 
     data-aos="fade-up">
    <div class="card-img-container">
        <img th:src="${animal.foto ?: '/images/default-pet.jpg'}" 
             th:alt="${animal.nome}"
             class="card-img-top animal-photo">
        <div class="animal-status-badge">
            <span th:replace="~{components/badges :: status-badge(${animal.status})}"></span>
        </div>
    </div>
    <div class="card-body">
        <h5 class="card-title animal-name" th:text="${animal.nome}">Nome do Animal</h5>
        <div class="animal-info">
            <p class="card-text">
                <i class="fas fa-paw me-2 text-muted"></i>
                <span th:text="${animal.especie + ' • ' + animal.raca}">Espécie • Raça</span>
            </p>
            <p class="card-text">
                <i class="fas fa-birthday-cake me-2 text-muted"></i>
                <span th:text="${animal.idade}">Idade</span>
            </p>
            <p class="card-text">
                <i class="fas fa-map-marker-alt me-2 text-muted"></i>
                <span th:text="${animal.localizacao}">Localização</span>
            </p>
        </div>
    </div>
    <div class="card-footer bg-transparent">
        <div class="d-flex gap-2">
            <a th:href="@{/animais/{id}(id=${animal.id})}" 
               class="btn btn-sm btn-outline-primary flex-fill">
                <i class="fas fa-eye me-1"></i>Ver Detalhes
            </a>
            <a th:href="@{/animais/{id}/editar(id=${animal.id})}" 
               class="btn btn-sm btn-outline-secondary">
                <i class="fas fa-edit"></i>
            </a>
        </div>
    </div>
</div>

<!-- Card de Usuário/Tutor -->
<div th:fragment="user-card(user)" 
     class="card user-card h-100" 
     data-aos="fade-up">
    <div class="card-body text-center">
        <div class="user-avatar-container mb-3">
            <img th:src="${user.avatar ?: '/images/default-avatar.png'}" 
                 th:alt="${user.nome}"
                 class="user-avatar rounded-circle">
        </div>
        <h5 class="card-title user-name" th:text="${user.nome}">Nome do Usuário</h5>
        <p class="card-text text-muted" th:text="${user.email}">email@exemplo.com</p>
        <div class="user-stats">
            <div class="row text-center">
                <div class="col">
                    <div class="user-stat">
                        <h6 th:text="${user.totalAdocoes ?: 0}">0</h6>
                        <small class="text-muted">Adoções</small>
                    </div>
                </div>
                <div class="col">
                    <div class="user-stat">
                        <h6 th:text="${user.totalDoacoes ?: 0}">0</h6>
                        <small class="text-muted">Doações</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="card-footer bg-transparent">
        <a th:href="@{/tutores/{id}(id=${user.id})}" 
           class="btn btn-sm btn-outline-primary w-100">
            <i class="fas fa-eye me-1"></i>Ver Perfil
        </a>
    </div>
</div>

<!-- Card de Notificação -->
<div th:fragment="notification-card(notification)" 
     class="card notification-card mb-3"
     th:classappend="${notification.read ? 'read' : 'unread'}">
    <div class="card-body">
        <div class="d-flex">
            <div class="notification-icon me-3">
                <i th:class="${'fas fa-' + notification.icon}" 
                   th:classappend="${'text-' + notification.type}"
                   aria-hidden="true"></i>
            </div>
            <div class="notification-content flex-grow-1">
                <h6 class="notification-title mb-1" th:text="${notification.title}">Título</h6>
                <p class="notification-message mb-2" th:text="${notification.message}">Mensagem</p>
                <small class="notification-time text-muted" 
                       th:text="${#temporals.format(notification.createdAt, 'dd/MM/yyyy HH:mm')}">
                       Data/Hora
                </small>
            </div>
            <div class="notification-actions">
                <button th:if="${not notification.read}" 
                        class="btn btn-sm btn-link p-0"
                        th:onclick="'markAsRead(this, ' + ${notification.id} + ')'"
                        title="Marcar como lida">
                    <i class="fas fa-check"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Card de Timeline/Atividade -->
<div th:fragment="activity-card(activity)" 
     class="card activity-card mb-3">
    <div class="card-body">
        <div class="activity-timeline">
            <div class="activity-marker" th:classappend="${'bg-' + activity.type}"></div>
            <div class="activity-content">
                <div class="d-flex justify-content-between align-items-start">
                    <div class="activity-info">
                        <h6 class="activity-title mb-1" th:text="${activity.title}">Título da Atividade</h6>
                        <p class="activity-description mb-0 text-muted" th:text="${activity.description}">
                            Descrição da atividade
                        </p>
                    </div>
                    <small class="activity-time text-muted" 
                           th:text="${#temporals.format(activity.createdAt, 'HH:mm')}">
                           Horário
                    </small>
                </div>
                <div th:if="${activity.badge}" class="activity-badge mt-2">
                    <span th:replace="~{components/badges :: status-badge(${activity.badge})}"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Card de Widget do Dashboard -->
<div th:fragment="widget-card(title, content, actions)" 
     class="card widget-card h-100">
    <div class="card-header bg-transparent">
        <div class="d-flex justify-content-between align-items-center">
            <h6 class="card-title mb-0" th:text="${title}">Widget Title</h6>
            <div th:if="${actions}" class="widget-actions">
                <div th:replace="${actions}"></div>
            </div>
        </div>
    </div>
    <div class="card-body">
        <div th:replace="${content}">
            <!-- Conteúdo do widget -->
        </div>
    </div>
</div>

</th:block>
