<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Novo Animal - PetX</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Cadastro de Novo Animal</h2>
        <a th:href="@{/animais}" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-2"></i>Voltar à Lista
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-triangle me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">Informações do Animal</h5>
        </div>
        <div class="card-body">
            <!-- Formulário tradicional com POST -->
            <form th:action="@{/animais/salvar}" method="post" th:object="${animal}">
                <div class="row">
                    <!-- Informações básicas -->
                    <div class="col-md-6">
                        <h6 class="mb-3 text-primary">Dados Básicos</h6>

                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome do Animal *</label>
                            <input type="text" class="form-control" id="nome" th:field="*{nome}" required>
                        </div>

                        <div class="mb-3">
                            <label for="especie" class="form-label">Espécie *</label>
                            <select class="form-select" id="especie" th:field="*{especie}" required>
                                <option value="">Selecione a espécie</option>
                                <option th:each="especie : ${especies}" 
                                        th:value="${especie}" 
                                        th:text="${especie.name()}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="raca" class="form-label">Raça</label>
                            <input type="text" class="form-control" id="raca" th:field="*{raca}" placeholder="Ex: Golden Retriever">
                        </div>

                        <div class="mb-3">
                            <label for="sexo" class="form-label">Sexo</label>
                            <select class="form-select" id="sexo" th:field="*{sexo}">
                                <option value="">Selecione o sexo</option>
                                <option th:each="sexo : ${sexos}" 
                                        th:value="${sexo}" 
                                        th:text="${sexo.name()}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="maturidade" class="form-label">Fase da Vida</label>
                            <select class="form-select" id="maturidade" th:field="*{maturidade}">
                                <option value="">Selecione a fase</option>
                                <option th:each="maturidade : ${maturidades}" 
                                        th:value="${maturidade}" 
                                        th:text="${maturidade.name()}"></option>
                            </select>
                        </div>
                    </div>

                    <!-- Informações físicas -->
                    <div class="col-md-6">
                        <h6 class="mb-3 text-primary">Características Físicas</h6>

                        <div class="mb-3">
                            <label for="corPelagem" class="form-label">Cor/Pelagem</label>
                            <input type="text" class="form-control" id="corPelagem" th:field="*{corPelagem}" placeholder="Ex: Dourado, Preto e branco">
                        </div>

                        <div class="mb-3">
                            <label for="porte" class="form-label">Porte</label>
                            <select class="form-select" id="porte" th:field="*{porte}">
                                <option value="">Selecione o porte</option>
                                <option th:each="porte : ${portes}" 
                                        th:value="${porte}" 
                                        th:text="${porte.name()}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="chipId" class="form-label">Número do Microchip</label>
                            <input type="text" class="form-control" id="chipId" th:field="*{chipId}">
                        </div>

                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" th:field="*{status}">
                                <option value="">Selecione o status</option>
                                <option th:each="status : ${statusEnum}" 
                                        th:value="${status}" 
                                        th:text="${status.name()}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="comportamento" class="form-label">Comportamento</label>
                            <input type="text" class="form-control" id="comportamento" th:field="*{comportamento}">
                        </div>
                    </div>
                </div>

                <!-- Observações -->
                <hr class="my-4">
                <div class="mb-3">
                    <label for="condicaoAnimal" class="form-label">Condição do Animal</label>
                    <textarea class="form-control" id="condicaoAnimal" th:field="*{condicaoAnimal}" rows="3"
                              placeholder="Informações adicionais sobre o animal, alergias, medicamentos, etc."></textarea>
                </div>

                <!-- Botões de ação -->
                <div class="d-flex gap-2 justify-content-end">
                    <a th:href="@{/animais}" class="btn btn-secondary">
                        <i class="fas fa-times me-2"></i>Cancelar
                    </a>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save me-2"></i>Salvar Animal
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
