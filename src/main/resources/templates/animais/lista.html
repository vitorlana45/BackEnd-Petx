<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Animais - ONG PetX</title>
</head>
<body>
<section class="animais">
    <!-- Cabeçalho Inteligente -->
    <div th:replace="~{fragmentos/page-header :: smart-header(${pageInfo}, ${actionButtons})}"></div>


    <div class="row g-3 mb-3">
        <div class="col-xl-3 col-md-6">
            <div class="card h-100 border-0 shadow-sm bg-primary-subtle">
                <div class="card-body p-3 d-flex align-items-center gap-3">
                    <div class="d-inline-flex justify-content-center align-items-center rounded-circle bg-primary-subtle text-primary" style="width:40px;height:40px">
                        <i class="fas fa-paw" aria-hidden="true"></i>
                    </div>
                    <div class="ms-auto text-end">
                        <div class="fs-5 fw-semibold" th:text="${page?.totalElements ?: 0}">0</div>
                        <div class="text-muted small">Total de Animais</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6">
            <div class="card h-100 border-0 shadow-sm bg-success-subtle">
                <div class="card-body p-3 d-flex align-items-center gap-3">
                    <div class="d-inline-flex justify-content-center align-items-center rounded-circle bg-success-subtle text-success" style="width:40px;height:40px">
                        <i class="fas fa-heart" aria-hidden="true"></i>
                    </div>
                    <div class="ms-auto text-end">
                        <div class="fs-5 fw-semibold" th:text="${totalDisponiveis ?: 0}">0</div>
                        <div class="text-muted small">Disponíveis</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6">
            <div class="card h-100 border-0 shadow-sm bg-info-subtle">
                <div class="card-body p-3 d-flex align-items-center gap-3">
                    <div class="d-inline-flex justify-content-center align-items-center rounded-circle bg-info-subtle text-info" style="width:40px;height:40px">
                        <i class="fas fa-home" aria-hidden="true"></i>
                    </div>
                    <div class="ms-auto text-end">
                        <div class="fs-5 fw-semibold" th:text="${totalAdotados ?: 0}">0</div>
                        <div class="text-muted small">Adotados</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6">
            <div class="card h-100 border-0 shadow-sm bg-warning-subtle">
                <div class="card-body p-3 d-flex align-items-center gap-3">
                    <div class="d-inline-flex justify-content-center align-items-center rounded-circle bg-warning-subtle text-warning" style="width:40px;height:40px">
                        <i class="fas fa-medkit" aria-hidden="true"></i>
                    </div>
                    <div class="ms-auto text-end">
                        <div class="fs-5 fw-semibold" th:text="${totalEmTratamento ?: 0}">0</div>
                        <div class="text-muted small">Em Tratamento</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Filtros Avançados -->
    <div class="card mb-3 shadow-sm">
        <div class="card-header py-2 d-flex align-items-center gap-2">
            <i class="fas fa-filter"></i>
            <h3 class="h6 mb-0">Filtros de Pesquisa</h3>
        </div>
        <div class="card-body py-3">
            <form method="get" class="row g-3">
                <!-- Linha 1: Filtros principais -->
                <div class="col-md-3">
                    <label class="form-label small">Nome do Animal</label>
                    <input type="text" class="form-control form-control-sm" name="nome"
                           th:value="${filtroNome}" placeholder="Digite o nome...">
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Raça</label>
                    <input type="text" class="form-control form-control-sm" name="raca"
                           th:value="${filtroRaca}" placeholder="Digite a raça...">
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Espécie</label>
                    <select class="form-select form-select-sm" name="especie">
                        <option value="">Todas as espécies</option>
                        <option th:each="esp : ${especies}"
                                th:value="${esp}"
                                th:text="${esp.especie}"
                                th:selected="${esp == filtroEspecie}">Espécie</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Status</label>
                    <select class="form-select form-select-sm" name="status">
                        <option value="">Todos os status</option>
                        <option th:each="st : ${statusEnum}"
                                th:value="${st}"
                                th:text="${st.status}"
                                th:selected="${st == filtroStatus}">Status</option>
                    </select>
                </div>

                <!-- Linha 2: Filtros secundários -->
                <div class="col-md-3">
                    <label class="form-label small">Porte</label>
                    <select class="form-select form-select-sm" name="porte">
                        <option value="">Todos os portes</option>
                        <option th:each="p : ${portes}"
                                th:value="${p}"
                                th:text="${p.porte}"
                                th:selected="${p == filtroPorte}">Porte</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Sexo</label>
                    <select class="form-select form-select-sm" name="sexo">
                        <option value="">Todos os sexos</option>
                        <option th:each="s : ${sexos}"
                                th:value="${s}"
                                th:text="${s.sexo}"
                                th:selected="${s == filtroSexo}">Sexo</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Origem</label>
                    <select class="form-select form-select-sm" name="origem">
                        <option value="">Todas as origens</option>
                        <option th:each="o : ${origens}"
                                th:value="${o}"
                                th:text="${o.OrigemAnimal}"
                                th:selected="${o == filtroOrigem}">Origem</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Chip ID</label>
                    <input type="text" class="form-control form-control-sm" name="chipId"
                           th:value="${filtroChipId}" placeholder="Digite o chip ID...">
                </div>

                <!-- Botões de ação -->
                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary btn-sm">
                        <i class="fas fa-search me-1"></i>Buscar
                    </button>
                    <a th:href="@{/animais}" class="btn btn-outline-secondary btn-sm">
                        <i class="fas fa-times me-1"></i>Limpar Filtros
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div id="lista-animais" th:replace="~{animais/fragmentos :: lista}"></div>
</section>



<script src="https://unpkg.com/htmx.org@2.0.3"></script>
<script>
    (function() {
        // Persistir visualização escolhida (cards/tabela)
        const group = document.querySelector('.btn-group[role="group"]');
        const cardsView = document.getElementById('cards-view');
        const tableView = document.getElementById('table-view');
        const STORAGE_KEY = 'animais:view';

        function setView(v){
            if(v === 'table'){
                cardsView.classList.add('d-none');
                tableView.classList.remove('d-none');
                document.getElementById('view-table').checked = true;
            } else {
                tableView.classList.add('d-none');
                cardsView.classList.remove('d-none');
                document.getElementById('view-cards').checked = true;
            }
            try { localStorage.setItem(STORAGE_KEY, v); } catch(_) {}
        }

        // Inicialização com preferência salva
        const saved = (function(){ try { return localStorage.getItem(STORAGE_KEY); } catch(_) { return null; } })();
        setView(saved === 'table' ? 'table' : 'cards');

        // Delegação de eventos
        if(group){
            group.addEventListener('click', function(e){
                const btn = e.target.closest('label[data-view]');
                if(!btn) return;
                setView(btn.getAttribute('data-view'));
            });
        }

        // Acessibilidade/teclado nos cards
        document.querySelectorAll('.animal-card').forEach(function(card){
            card.addEventListener('keydown', function(e){
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    const link = card.closest('a');
                    if(link) link.click();
                }
            });
        });
    })();
</script>

</body>
</html>
