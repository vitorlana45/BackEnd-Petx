<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Animais - PetX</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Animais</h2>
        <a href="/boletins/novo" class="btn btn-success">
            <i class="fas fa-plus me-2"></i>Novo Animal
        </a>
    </div>

    <div class="card mb-3">
        <div class="card-header">
            <h5 class="mb-0">Filtros</h5>
        </div>
        <div class="card-body">
            <form method="get" th:action="@{/animais}" class="row g-2 align-items-end">
                <div class="col-12 col-sm-6 col-md-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input id="nome" name="nome" class="form-control" th:value="${filtroNome}">
                </div>
                <div class="col-12 col-sm-6 col-md-3">
                    <label for="raca" class="form-label">Raça</label>
                    <input id="raca" name="raca" class="form-control" th:value="${filtroRaca}">
                </div>
                <div class="col-6 col-sm-4 col-md-2">
                    <label class="form-label" for="especie">Espécie</label>
                    <select id="especie" name="especie" class="form-select">
                        <option th:selected="${filtroEspecie == null}" value="">Todas</option>
                        <option th:each="e : ${T(org.ong.pet.pex.backendpetx.enums.EspecieEnum).values()}"
                                th:value="${e}"
                                th:text="${e}"
                                th:selected="${filtroEspecie == e}"></option>
                    </select>
                </div>
                <div class="col-6 col-sm-4 col-md-2">
                    <label class="form-label" for="porte">Porte</label>
                    <select id="porte" name="porte" class="form-select">
                        <option th:selected="${filtroPorte == null}" value="">Todos</option>
                        <option th:each="p : ${T(org.ong.pet.pex.backendpetx.enums.PorteEnum).values()}"
                                th:value="${p}"
                                th:text="${p}"
                                th:selected="${filtroPorte == p}"></option>
                    </select>
                </div>
                <div class="col-6 col-sm-4 col-md-2">
                    <label class="form-label" for="status">Status</label>
                    <select id="status" name="status" class="form-select">
                        <option th:selected="${filtroStatus == null}" value="">Todos</option>
                        <option th:each="s : ${T(org.ong.pet.pex.backendpetx.enums.StatusEnum).values()}"
                                th:value="${s}"
                                th:text="${s}"
                                th:selected="${filtroStatus == s}"></option>
                    </select>
                </div>
                <div class="col-6 col-sm-4 col-md-2">
                    <label class="form-label" for="sexo">Sexo</label>
                    <select id="sexo" name="sexo" class="form-select">
                        <option th:selected="${filtroSexo == null}" value="">Todos</option>
                        <option th:each="sx : ${T(org.ong.pet.pex.backendpetx.enums.SexoEnum).values()}"
                                th:value="${sx}"
                                th:text="${sx}"
                                th:selected="${filtroSexo == sx}"></option>
                    </select>
                </div>
                <div class="col-6 col-sm-4 col-md-2">
                    <label class="form-label" for="maturidade">Maturidade</label>
                    <select id="maturidade" name="maturidade" class="form-select">
                        <option th:selected="${filtroMaturidade == null}" value="">Todas</option>
                        <option th:each="m : ${T(org.ong.pet.pex.backendpetx.enums.MaturidadeEnum).values()}"
                                th:value="${m}"
                                th:text="${m}"
                                th:selected="${filtroMaturidade == m}"></option>
                    </select>
                </div>
                <div class="col-6 col-sm-4 col-md-2">
                    <label class="form-label" for="origem">Origem</label>
                    <select id="origem" name="origem" class="form-select">
                        <option th:selected="${filtroOrigem == null}" value="">Todas</option>
                        <option th:each="o : ${T(org.ong.pet.pex.backendpetx.enums.OrigemAnimalEnum).values()}"
                                th:value="${o}"
                                th:text="${o}"
                                th:selected="${filtroOrigem == o}"></option>
                    </select>
                </div>
                <div class="col-12 col-sm-6 col-md-3">
                    <label class="form-label" for="doenca">Doença</label>
                    <input id="doenca" name="doenca" class="form-control" th:value="${filtroDoenca}">
                </div>
                <div class="col-12 col-sm-6 col-md-3">
                    <label class="form-label" for="comportamento">Comportamento</label>
                    <input id="comportamento" name="comportamento" class="form-control" th:value="${filtroComportamento}">
                </div>
                <div class="col-12 col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-search me-2"></i>Buscar</button>
                    <a th:href="@{/animais}" class="btn btn-secondary"><i class="fas fa-times me-2"></i>Limpar</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">Lista</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Chip</th>
                        <th>Nome</th>
                        <th>Espécie</th>
                        <th>Raça</th>
                        <th>Status</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${animais}">
                        <td th:text="${a.id}">1</td>
                        <td th:text="${a.chipId}">ABC</td>
                        <td th:text="${a.nome}">Rex</td>
                        <td th:text="${a.especie}">CÃO</td>
                        <td th:text="${a.raca}">VIRA-LATA</td>
                        <td>
                            <span class="badge" th:text="${a.status}" th:classappend="${a.status == 'ADOTADO' ? ' bg-success' : (a.status == 'FALECIDO' ? ' bg-secondary' : ' bg-info')}"></span>
                        </td>
                        <td class="text-end">
                            <div class="btn-group btn-group-sm" role="group">
                                <a th:href="@{'/animais/' + ${a.id}}" class="btn btn-primary"><i class="fas fa-eye"></i></a>
                                <form th:action="@{'/animais/' + ${a.id} + '/excluir'}" method="post" style="display:inline-block">
                                    <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(animais)}">
                        <td colspan="7" class="text-center text-muted py-4">Nenhum animal encontrado com os filtros informados.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer">
            <!-- Construção da string de filtros para paginação -->
            <th:block th:with="filtros=''
                , filtros=${filtroNome != null && !#strings.isEmpty(filtroNome) ? filtros + '&nome=' + filtroNome : filtros}
                , filtros=${filtroRaca != null && !#strings.isEmpty(filtroRaca) ? filtros + '&raca=' + filtroRaca : filtros}
                , filtros=${filtroEspecie != null ? filtros + '&especie=' + filtroEspecie : filtros}
                , filtros=${filtroPorte != null ? filtros + '&porte=' + filtroPorte : filtros}
                , filtros=${filtroStatus != null ? filtros + '&status=' + filtroStatus : filtros}
                , filtros=${filtroDoenca != null && !#strings.isEmpty(filtroDoenca) ? filtros + '&doenca=' + filtroDoenca : filtros}
                , filtros=${filtroComportamento != null && !#strings.isEmpty(filtroComportamento) ? filtros + '&comportamento=' + filtroComportamento : filtros}
                , filtros=${filtroMaturidade != null ? filtros + '&maturidade=' + filtroMaturidade : filtros}
                , filtros=${filtroOrigem != null ? filtros + '&origem=' + filtroOrigem : filtros}
                , filtros=${filtroSexo != null ? filtros + '&sexo=' + filtroSexo : filtros}">
                <div th:replace="~{fragmentos/paginacao :: pagination(${page}, '/animais', ${filtros})}"></div>
            </th:block>
        </div>
    </div>
</section>
</body>
</html>
