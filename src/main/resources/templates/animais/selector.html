<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="selector">
    <!-- Vazio -->
    <div class="list-group-item small text-muted" th:if="${page.totalElements == 0}">
        Nenhum animal encontrado.
    </div>

    <!-- Itens -->
    <div class="list-group-item d-flex align-items-center justify-content-between"
         th:each="a : ${animais}">
        <div class="me-2">
            <div class="fw-semibold" th:text="${a.nome}">Nome</div>
            <div class="small text-muted">
                <span th:text="${a.especie}">Espécie</span> •
                <span th:text="${a.sexo}">Sexo</span> •
                <span th:text="${a.porte}">Porte</span>
                <span th:if="${a.chipId != null}"> • Chip: <span th:text="${a.chipId}">000</span></span>
            </div>
        </div>

        <!-- Checkbox de seleção (mais acessível) -->
        <div class="form-check ms-2">
            <input class="form-check-input"
                   type="checkbox"
                   th:attr="data-animal-id=${a.id},data-animal-name=${a.nome}">
        </div>
    </div>

    <!-- Paginação opcional (se quiser reaproveitar seu fragmento padrão) -->
    <div class="list-group-item">
        <div class="d-flex justify-content-between align-items-center">
            <button class="btn btn-sm btn-outline-secondary"
                    th:if="${page.number > 0}"
                    th:attr="hx-get=@{/tutores/selector(page=${page.number - 1})}"
                    hx-target="#resultado-animais" hx-swap="innerHTML">
                <i class="fas fa-chevron-left me-1"></i>Anterior
            </button>
            <small class="text-muted">Página <span th:text="${page.number + 1}">1</span> de <span th:text="${page.totalPages}">1</span></small>
            <button class="btn btn-sm btn-outline-secondary"
                    th:if="${page.number + 1 < page.totalPages}"
                    th:attr="hx-get=@{/tutores/selector(page=${page.number + 1})}"
                    hx-target="#resultado-animais" hx-swap="innerHTML">
                Próxima<i class="fas fa-chevron-right ms-1"></i>
            </button>
        </div>
    </div>
</th:block>
