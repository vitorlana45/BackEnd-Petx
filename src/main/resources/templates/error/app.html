<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout(~{::title}, ~{::section})}"
      lang="pt-BR">
<head>
  <title>Erro - PetX</title>
</head>
<body>
<section class="py-4">
  <!-- O base já faz: <div th:replace="~{fragmentos/messages :: messages}"></div> -->
  <div class="card shadow-sm">
    <div class="card-body">
      <h1 class="h5 mb-2" th:text="${status} + ' ' + ${erro}">Erro</h1>
      <p class="mb-3" th:if="${mensagem}" th:text="${mensagem}">Ocorreu um erro.</p>
      <a class="btn btn-outline-primary" th:href="@{/animais}">Voltar</a>
    </div>
  </div>
</section>
</body>
</html>
