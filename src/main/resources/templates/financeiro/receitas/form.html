<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout(~{::title}, ~{::content})}">
<head>
    <title th:text="${receita.id != null ? 'Editar Receita' : 'Nova Receita'} + ' - PetX'">Nova Receita</title>
</head>
<body>
<div th:fragment="content">
    <div class="container-fluid">
        <!-- Cabeçalho -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="text-primary mb-0">
                    <i class="fas fa-hand-holding-usd"></i>
                    <span th:text="${receita.id != null ? 'Editar Receita' : 'Nova Receita'}">Nova Receita</span>
                </h2>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="/financeiro">Financeiro</a></li>
                        <li class="breadcrumb-item"><a href="/financeiro/receitas">Receitas</a></li>
                        <li class="breadcrumb-item active" th:text="${receita.id != null ? 'Editar' : 'Nova'}">Nova</li>
                    </ol>
                </nav>
            </div>
            <a href="/financeiro/receitas" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left"></i> Voltar à Lista
            </a>
        </div>

        <!-- Alertas -->
        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Formulário -->
        <div class="card shadow mb-4 container-max w-75">
            <div class="card-header py-3 bg-success text-white">
                <h6 class="m-0 font-weight-bold">Dados da Receita</h6>
            </div>
            <div class="card-body">
                <form th:action="@{/financeiro/receitas/salvar}" th:object="${receita}" method="post">
                    <input type="hidden" th:field="*{id}" />

                    <div class="row g-3">
                        <!-- Descrição -->
                        <div class="col-md-12">
                            <label for="descricao" class="form-label">Descrição <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="descricao" th:field="*{descricao}" required
                                   placeholder="Ex: Doação Campanha de Inverno" maxlength="255">
                        </div>

                        <!-- Valor e Data -->
                        <div class="col-md-4">
                            <label for="valor" class="form-label">Valor (R$) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">R$</span>
                                <input type="number" class="form-control" id="valor" th:field="*{valor}" step="0.01" min="0" required>
                            </div>
                        </div>

                        <div class="col-md-4">
                            <label for="dataRecebimento" class="form-label">Data Recebimento</label>
                            <input type="date" class="form-control" id="dataRecebimento" th:field="*{dataRecebimento}">
                        </div>

                        <div class="col-md-4">
                            <label for="categoria" class="form-label">Categoria</label>
                            <select class="form-select" id="categoria" th:field="*{categoria}">
                                <option value="Doação">Doação</option>
                                <option value="Venda">Venda</option>
                                <option value="Evento">Evento</option>
                                <option value="Outros">Outros</option>
                            </select>
                        </div>

                        <!-- Origem e Forma de Pagamento -->
                        <div class="col-md-6">
                            <label for="origem" class="form-label">Origem / Doador</label>
                            <input type="text" class="form-control" id="origem" th:field="*{origem}"
                                   placeholder="Nome do doador ou empresa">
                        </div>

                        <div class="col-md-6">
                            <label for="formaPagamento" class="form-label">Forma de Pagamento</label>
                            <select class="form-select" id="formaPagamento" th:field="*{formaPagamento}">
                                <option th:each="forma : ${T(org.ong.pet.pex.backendpetx.enums.FormaPagamentoEnum).values()}"
                                        th:value="${forma}" th:text="${forma}"></option>
                            </select>
                        </div>

                        <!-- Observações -->
                        <div class="col-12">
                            <label for="observacoes" class="form-label">Observações</label>
                            <textarea class="form-control" id="observacoes" th:field="*{observacoes}"
                                      rows="3" placeholder="Informações adicionais sobre a receita..."></textarea>
                        </div>
                    </div>

                    <hr class="mt-4">

                    <div class="d-flex justify-content-end gap-2">
                        <a href="/financeiro" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success px-4">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
