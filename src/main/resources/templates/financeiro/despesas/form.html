<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout(~{::title}, ~{::content})}">
<head>
    <title th:text="${despesa.id != null ? 'Editar Despesa' : 'Nova Despesa'} + ' - PetX'">Nova Despesa</title>
</head>
<body>
<div th:fragment="content">
    <div class="container-fluid">
        <!-- Cabeçalho -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="text-primary mb-0">
                    <i class="fas fa-file-invoice-dollar"></i>
                    <span th:text="${despesa.id != null ? 'Editar Despesa' : 'Nova Despesa'}">Nova Despesa</span>
                </h2>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="/financeiro/despesas">Despesas</a></li>
                        <li class="breadcrumb-item active" th:text="${despesa.id != null ? 'Editar' : 'Nova'}">Nova</li>
                    </ol>
                </nav>
            </div>
            <a href="/financeiro/despesas" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left"></i> Voltar
            </a>
        </div>

        <!-- Alertas -->
        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Formulário -->
        <div class="card shadow mb-4">
            <div class="card-header py-3 bg-danger text-white">
                <h6 class="m-0 font-weight-bold">Dados da Despesa</h6>
            </div>
            <div class="card-body">
                <form th:action="@{/financeiro/despesas/salvar}" th:object="${despesa}" method="post">
                    <input type="hidden" th:field="*{id}" />

                    <div class="row g-3">
                        <!-- Descrição -->
                        <div class="col-md-12">
                            <label for="descricao" class="form-label">Descrição <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="descricao" th:field="*{descricao}" required
                                   placeholder="Ex: Conta de Luz, Vacinas para Gatos" maxlength="255">
                        </div>

                        <!-- Valor e Datas -->
                        <div class="col-md-4">
                            <label for="valor" class="form-label">Valor (R$) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">R$</span>
                                <input type="number" class="form-control" id="valor" th:field="*{valor}" step="0.01" min="0" required>
                            </div>
                        </div>

                        <div class="col-md-4">
                            <label for="dataPrevistaPagamento" class="form-label">Data de Vencimento</label>
                            <input type="date" class="form-control" id="dataPrevistaPagamento" th:field="*{dataPrevistaPagamento}">
                        </div>

                        <div class="col-md-4">
                            <label for="dataPagamento" class="form-label">Data do Pagamento (Opcional)</label>
                            <input type="date" class="form-control" id="dataPagamento" th:field="*{dataPagamento}">
                        </div>

                        <!-- Categoria e Status -->
                        <div class="col-md-4">
                            <label for="categoria" class="form-label">Categoria</label>
                            <select class="form-select" id="categoria" th:field="*{categoria}">
                                <option th:each="cat : ${categorias}" th:value="${cat}" th:text="${cat}"></option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="statusDespesa" class="form-label">Status</label>
                            <select class="form-select" id="statusDespesa" th:field="*{statusDespesa}">
                                <option th:each="st : ${statusList}" th:value="${st}" th:text="${st}"></option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="formaPagamento" class="form-label">Forma de Pagamento</label>
                            <select class="form-select" id="formaPagamento" th:field="*{formaPagamento}">
                                <option th:each="fp : ${formasPagamento}" th:value="${fp}" th:text="${fp}"></option>
                            </select>
                        </div>

                        <!-- Observações / Detalhes Adicionais -->
                        <div class="col-12 mt-4">
                            <div class="card border-0">
                                <div class="card-body">
                                    <h6 class="card-title text-muted"><i class="fas fa-list"></i> Observações / Detalhes Adicionais</h6>
                                    <small class="text-muted d-block mb-2">Adicione informações extras sobre a despesa (texto livre).</small>

                                    <textarea class="form-control" id="observacoes" th:field="*{observacoes}"
                                              rows="4" placeholder="Ex: Consumo de 350 kWh, Ração marca Pedigree..."></textarea>
                                </div>
                            </div>
                        </div>
                    </div>

                    <hr class="mt-4">

                    <div class="d-flex justify-content-end gap-2">
                        <a href="/financeiro/despesas" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-danger px-4">Salvar Despesa</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
