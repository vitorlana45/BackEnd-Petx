<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - PetX</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-container mb-3">
                    <img th:src="@{/images/logo-petx.svg}" alt="PetX Logo" style="height:52px; filter:brightness(0) invert(1);">
                </div>
                <h1 class="h4 mb-1">Recuperar Senha</h1>
                <p class="mb-0 opacity-75" style="font-size:.875rem;">Enviaremos instruções para o seu e-mail</p>
            </div>

            <div class="login-body-content">
                <div th:if="${successMessage}" class="alert alert-success mb-3" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${successMessage}"></span>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger mb-3" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <span th:text="${errorMessage}"></span>
                </div>

                <form th:action="@{/forgot-password}" method="post">
                    <div class="mb-4">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope me-2"></i>E-mail cadastrado
                        </label>
                        <input type="email" class="form-control" id="email" name="email"
                               placeholder="Digite seu e-mail" required autofocus>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-login">
                            <i class="fas fa-paper-plane me-2"></i>Enviar instruções
                        </button>
                    </div>
                </form>

                <div class="text-center">
                    <small>
                        <a class="text-decoration-none" th:href="@{/login}">
                            <i class="fas fa-arrow-left me-1"></i>Voltar ao login
                        </a>
                    </small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
