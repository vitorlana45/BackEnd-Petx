<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: layout(~{::title}, ~{::content})}">

<head>
    <title>Dashboard PetX</title>
</head>

<body>
    <main th:fragment="content">
        <!-- Dashboard Header -->
        <div th:replace="~{fragmentos/ui :: dashboard-header}"></div>

        <!-- Main Dashboard Content -->
        <section class="dashboard-content py-4">
            <div class="container-fluid">

                <!-- Quick Actions Grid Section -->
                <div th:replace="~{fragmentos/ui :: quick-actions-grid}"></div>

                <!-- Three Column Layout -->
                <div class="row g-4">

                    <!-- COLUNA 1 (esquerda) -->
                    <div class="col-12 col-xl-3 order-xl-1">
                        <!-- Critical Alerts -->
                        <div th:replace="~{fragmentos/ui :: critical-alerts-card}"></div>

                        <!-- Stock Summary -->
                        <div th:replace="~{fragmentos/ui :: stock-summary-card}"></div>
                    </div>

                    <!-- COLUNA 2 (central/principal) -->
                    <div class="col-12 col-xl-6 order-xl-2">
                        <!-- Activity Timeline -->
                        <div th:replace="~{fragmentos/ui :: activity-timeline-card}"></div>

                        <!-- Upcoming Consultations -->
                        <div th:replace="~{fragmentos/ui :: upcoming-consultations-card}"></div>
                    </div>

                    <!-- COLUNA 3 (direita) -->
                    <div class="col-12 col-xl-3 order-xl-3">
                        <!-- Animal Status -->
                        <div th:replace="~{fragmentos/ui :: animal-status-card}"></div>

                        <!-- Recent Adoptions -->
                        <div th:replace="~{fragmentos/ui :: recent-adoptions-card}"></div>

                        <!-- Volunteers Panel -->
                        <div th:replace="~{fragmentos/ui :: volunteers-panel-card}"></div>
                    </div>

                </div>
            </div>
        </section>
    </main>
</body>

</html>
