<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: layout('Teste - PetX', ~{::content})}">

<body>
  <section th:fragment="content">
    <div class="container">
      <h1>Página de Teste - Sistema de Exceções</h1>

      <div class="row">
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">
              <h5>Teste de Exceção Normal</h5>
            </div>
            <div class="card-body">
              <p>Clique no botão abaixo para testar uma exceção normal (não-HTMX):</p>
              <a href="/teste/excecao" class="btn btn-danger">Testar Exceção</a>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card">
            <div class="card-header">
              <h5>Teste de Exceção HTMX</h5>
            </div>
            <div class="card-body">
              <p>Clique no botão abaixo para testar uma exceção via HTMX:</p>
              <button class="btn btn-warning" hx-post="/teste/excecao-htmx" hx-target="#resultado-htmx"
                hx-swap="innerHTML">
                Testar Exceção HTMX
              </button>
              <div id="resultado-htmx" class="mt-3">
                <!-- Resultado será inserido aqui -->
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="row mt-4">
        <div class="col-12">
          <div class="card">
            <div class="card-header">
              <h5>Mensagens do Sistema</h5>
            </div>
            <div class="card-body">
              <div th:replace="~{fragmentos/messages :: messages}"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>

</html>
