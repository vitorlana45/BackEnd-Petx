<!-- Filtros Simples -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="search-filters" class="card mb-4">
    <div class="card-body">
        <form method="get" class="row g-3">
            <div class="col-md-4">
                <label class="form-label">Nome</label>
                <input type="text" class="form-control" name="nome" th:value="${param.nome}" placeholder="Digite o nome...">
            </div>
            <div class="col-md-3" th:if="${showStatusFilter}">
                <label class="form-label">Status</label>
                <select class="form-select" name="status">
                    <option value="">Todos</option>
                    <option value="ATIVO" th:selected="${param.status == 'ATIVO'}">Ativo</option>
                    <option value="INATIVO" th:selected="${param.status == 'INATIVO'}">Inativo</option>
                </select>
            </div>
            <div class="col-md-3" th:if="${showEspecieFilter}">
                <label class="form-label">Espécie</label>
                <select class="form-select" name="especie">
                    <option value="">Todas</option>
                    <option value="CACHORRO" th:selected="${param.especie == 'CACHORRO'}">Cachorro</option>
                    <option value="GATO" th:selected="${param.especie == 'GATO'}">Gato</option>
                    <option value="OUTRO" th:selected="${param.especie == 'OUTRO'}">Outro</option>
                </select>
            </div>
            <div class="col d-flex align-items-end">
                <button type="submit" class="btn btn-primary me-2">
                    <i class="fas fa-search me-1"></i>Buscar
                </button>
                <a href="?" class="btn btn-outline-secondary">
                    <i class="fas fa-times me-1"></i>Limpar
                </a>
            </div>
        </form>
    </div>
</div>
