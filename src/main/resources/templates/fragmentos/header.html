<!--
  Fragmento para o header superior da aplicação
  Uso: th:replace="~{fragmentos/header :: header}"
-->
<header xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  th:fragment="header" class="app-header" aria-label="Cabeçalho da aplicação">

  <div class="header-container">
    <!-- Botão do menu mobile -->
    <button class="header-menu-toggle d-lg-none" id="sidebarToggle" type="button" aria-label="Abrir menu">
      <i class="fas fa-bars"></i>
    </button>

    <!-- Breadcrumb e título da página -->
    <div class="header-breadcrumb">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
          <li class="breadcrumb-item">
            <a th:href="@{/home}">
              <i class="fas fa-home"></i>
            </a>
          </li>
          <li class="breadcrumb-item active" aria-current="page">
            <span th:text="${pageTitle != null ? pageTitle : 'Dashboard'}">Dashboard</span>
          </li>
        </ol>
      </nav>
    </div>

    <!-- Ações do header -->
    <div class="header-actions">
      <!-- Notificações -->
      <div class="header-notifications dropdown">
        <button class="btn btn-link position-relative" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="fas fa-bell"></i>
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
            th:if="${notificacoesNaoLidas != null && notificacoesNaoLidas > 0}" th:text="${notificacoesNaoLidas}">
            0
          </span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li>
            <h6 class="dropdown-header">Notificações</h6>
          </li>
          <li th:if="${notificacoes == null || #lists.isEmpty(notificacoes)}">
            <span class="dropdown-item-text text-muted">Nenhuma notificação</span>
          </li>
          <li th:each="notif : ${notificacoes}">
            <a class="dropdown-item" th:href="${notif.link}">
              <div class="d-flex align-items-center">
                <div class="notification-icon me-2">
                  <i class="fas"
                    th:classappend="${notif.tipo == 'ALERTA' ? 'fa-exclamation-triangle text-warning' : 'fa-info-circle text-info'}"></i>
                </div>
                <div class="notification-content">
                  <div class="notification-title" th:text="${notif.titulo}">Título</div>
                  <div class="notification-time small text-muted"
                    th:text="${#temporals.format(notif.data, 'dd/MM HH:mm')}">01/01 12:00</div>
                </div>
              </div>
            </a>
          </li>
          <li>
            <hr class="dropdown-divider">
          </li>
          <li><a class="dropdown-item" th:href="@{/notificacoes}">Ver todas</a></li>
        </ul>
      </div>

      <!-- Seletor de tema -->
      <div class="header-theme-toggle">
        <button class="btn btn-link" type="button" id="themeToggle" title="Alternar tema">
          <i class="fas fa-sun" id="themeIcon"></i>
        </button>
      </div>

      <!-- Menu do usuário -->
      <div class="header-user dropdown" sec:authorize="isAuthenticated()">
        <button class="btn btn-link d-flex align-items-center" type="button" data-bs-toggle="dropdown"
          aria-expanded="false">
          <div class="user-avatar-sm me-2">
            <i class="fas fa-user"></i>
          </div>
          <span class="user-name d-none d-md-inline" sec:authentication="name">Usuário</span>
          <i class="fas fa-chevron-down ms-1"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li>
            <a class="dropdown-item" th:href="@{/perfil}">
              <i class="fas fa-user-edit me-2"></i>Meu Perfil
            </a>
          </li>
          <li>
            <a class="dropdown-item" th:href="@{/configuracoes}">
              <i class="fas fa-cog me-2"></i>Configurações
            </a>
          </li>
          <li>
            <hr class="dropdown-divider">
          </li>
          <li>
            <form th:action="@{/logout}" method="post" class="d-inline">
              <button type="submit" class="dropdown-item text-danger">
                <i class="fas fa-sign-out-alt me-2"></i>Sair
              </button>
            </form>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Script para controle do tema -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const themeToggle = document.getElementById('themeToggle');
      const themeIcon = document.getElementById('themeIcon');

      if (themeToggle) {
        themeToggle.addEventListener('click', function () {
          const currentTheme = document.documentElement.getAttribute('data-theme');
          const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

          // Aplicar classe para evitar transições durante a troca
          document.body.classList.add('theme-switching');

          // Trocar tema
          document.documentElement.setAttribute('data-theme', newTheme);
          localStorage.setItem('theme', newTheme);

          // Atualizar ícone
          themeIcon.className = newTheme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';

          // Remover classe após um breve delay
          setTimeout(() => {
            document.body.classList.remove('theme-switching');
          }, 100);
        });

        // Definir ícone inicial
        const currentTheme = document.documentElement.getAttribute('data-theme');
        themeIcon.className = currentTheme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
      }
    });
  </script>
</header>
