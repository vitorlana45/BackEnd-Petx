<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <nav th:fragment="menu" class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid container-max">
            <a class="navbar-brand d-flex align-items-center" href="#" th:href="@{/dashboard}">
                <img th:src="@{/images/logo-petx-branco.svg}" alt="ONG PetX" class="navbar-brand-img me-2">
                <span class="d-none d-sm-inline">ONG PetX</span>
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <!-- Dashboard - Todos os usuários autenticados -->
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${currentPage == '/dashboard' ? 'active' : ''}"
                           href="#" th:href="@{/dashboard}">
                            <i class="fas fa-tachometer-alt me-1"></i>Dashboard
                        </a>
                    </li>

                    <!-- Pets - ADMIN e COLABORADOR -->
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'COLABORADOR')">
                        <a class="nav-link" th:classappend="${currentPage != null && currentPage.startsWith('/animais') ? 'active' : ''}"
                           href="#" th:href="@{/animais}">
                            <i class="fas fa-paw me-1"></i>Animais
                        </a>
                    </li>

                    <!-- Tutores - ADMIN e COLABORADOR -->
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'COLABORADOR')">
                        <a class="nav-link" th:classappend="${currentPage != null && currentPage.startsWith('/tutores') ? 'active' : ''}"
                           href="#" th:href="@{/tutores}">
                            <i class="fas fa-user-friends me-1"></i>Adotantes
                        </a>
                    </li>

                    <!-- Boletins - ADMIN e COLABORADOR -->
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'COLABORADOR')">
                        <a class="nav-link"
                           th:href="@{/resgates}">
                            <i class="fas fa-clipboard-list me-1"></i>Resgates
                        </a>
                    </li>

                    <!-- Menu Administrativo - APENAS ADMIN -->
                    <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link dropdown-toggle" th:classappend="${currentPage != null && currentPage.startsWith('/admin') ? 'active' : ''}"
                           href="#" id="adminDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-cog me-1"></i>Administração
                        </a>
                        <ul class="dropdown-menu shadow-lg" aria-labelledby="adminDropdown">
                            <li><a class="dropdown-item" th:classappend="${currentPage == '/admin' ? 'active' : ''}"
                                  th:href="@{/admin}">
                                <i class="fas fa-tachometer-alt me-2"></i>Painel Admin
                            </a></li>
                            <li><a class="dropdown-item" th:classappend="${currentPage != null && currentPage.startsWith('/admin/usuarios') ? 'active' : ''}"
                                  th:href="@{/admin/usuarios}">
                                <i class="fas fa-user-cog me-2"></i>Usuários
                            </a></li>
                            <li><a class="dropdown-item" th:classappend="${currentPage != null && currentPage.startsWith('/admin/voluntarios') ? 'active' : ''}"
                                  th:href="@{/admin/voluntarios}">
                                <i class="fas fa-hands-helping me-2"></i>Voluntários
                            </a></li>
                            <li><a class="dropdown-item" th:classappend="${currentPage != null && currentPage.startsWith('/admin/doacoes') ? 'active' : ''}"
                                  th:href="@{/admin/doacoes}">
                                <i class="fas fa-gift me-2"></i>Doações
                            </a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" th:classappend="${currentPage != null && currentPage.startsWith('/admin/relatorios') ? 'active' : ''}"
                                  th:href="@{/admin/relatorios}">
                                <i class="fas fa-chart-bar me-2"></i>Relatórios
                            </a></li>
                            <li><a class="dropdown-item" th:classappend="${currentPage != null && currentPage.startsWith('/admin/configuracoes') ? 'active' : ''}"
                                  th:href="@{/admin/configuracoes}">
                                <i class="fas fa-sliders-h me-2"></i>Configurações
                            </a></li>
                        </ul>
                    </li>
                </ul>

                <!-- Ações à direita: toggle de tema + usuário -->
                <div class="d-flex align-items-center gap-3">
                    <button id="theme-toggle" class="btn btn-sm theme-toggle" title="Alternar tema" type="button">
                        <i class="fas fa-moon"></i>
                    </button>

                    <ul class="navbar-nav">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown" role="button"
                               data-bs-toggle="dropdown" aria-expanded="false">
                                <div class="avatar-circle me-2">
                                    <span class="avatar-initials" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">U</span>
                                </div>
                                <span sec:authentication="name" class="d-none d-md-inline">Usuário</span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end shadow-lg" aria-labelledby="userDropdown">
                                <li class="dropdown-item-text">
                                    <div class="d-flex align-items-center">
                                        <div class="avatar-circle me-2">
                                            <span class="avatar-initials" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">U</span>
                                        </div>
                                        <div>
                                            <div class="fw-semibold" sec:authentication="name">Usuário</div>
                                            <div class="small text-muted" sec:authentication="principal.authorities">Perfil</div>
                                        </div>
                                    </div>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="#" th:href="@{/perfil}">
                                    <i class="fas fa-user-edit me-2"></i>Meu Perfil
                                </a></li>
                                <li><a class="dropdown-item" href="#" th:href="@{/configuracoes}">
                                    <i class="fas fa-cog me-2"></i>Configurações
                                </a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <form th:action="@{/logout}" method="post" class="d-inline">
                                        <button type="submit" class="dropdown-item text-danger">
                                            <i class="fas fa-sign-out-alt me-2"></i>Sair
                                        </button>
                                    </form>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <style>
    .avatar-circle {
        width: 32px;
        height: 32px;
        background-color: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .avatar-initials {
        color: white;
        font-size: 14px;
        font-weight: 600;
    }

    .dropdown-menu .avatar-circle {
        background-color: var(--petx-primary);
    }

    /* Menu item ativo */
    .navbar-dark .navbar-nav .nav-link.active {
        background-color: rgba(255, 255, 255, 0.15);
        font-weight: 500;
    }

    .dropdown-item.active {
        background-color: var(--petx-primary);
        color: white;
    }
    </style>
</body>
</html>
