<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <nav th:fragment="menu" class="navbar navbar-expand-lg navbar-dark">

        <div class="container">
            <a class="navbar-brand" href="#" th:href="@{/dashboard}">
                <img th:src="@{/images/logo-petx-branco.svg}" alt="PetX" class="navbar-brand-img">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <!-- Dashboard - Todos os usuários autenticados -->
                    <li class="nav-item">
                        <a class="nav-link" href="#" th:href="@{/dashboard}">
                            <i class="fas fa-home me-1"></i>Dashboard
                        </a>
                    </li>

                    <!-- Pets - ADMIN e COLABORADOR -->
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'COLABORADOR')">
                        <a class="nav-link" href="#" th:href="@{/animais}">
                            Pets
                        </a>
                    </li>

                    <!-- Tutores - ADMIN e COLABORADOR (substitui Clientes) -->
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'COLABORADOR')">
                        <a class="nav-link" href="#" th:href="@{/tutores}">
                            <i class="fas fa-user-friends me-1"></i>Tutores
                        </a>
                    </li>

                    <!-- Consultas - ADMIN e COLABORADOR -->
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'COLABORADOR')">
                        <a class="nav-link" href="#" th:href="@{/consultas}">
                            <i class="fas fa-calendar-alt me-1"></i>Consultas
                        </a>
                    </li>

                    <!-- Menu Administrativo - APENAS ADMIN -->
                    <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link dropdown-toggle" href="#" id="adminDropdown" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-cog me-1"></i>Administração
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="adminDropdown">
                            <li><a class="dropdown-item" th:href="@{/admin}">
                                <i class="fas fa-tachometer-alt me-1"></i>Painel Admin
                            </a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/usuarios}">
                                <i class="fas fa-user-cog me-1"></i>Usuários
                            </a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" th:href="@{/admin/relatorios}">
                                <i class="fas fa-chart-bar me-1"></i>Relatórios
                            </a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/configuracoes}">
                                <i class="fas fa-sliders-h me-1"></i>Configurações
                            </a></li>
                        </ul>
                    </li>
                </ul>

                <!-- Ações à direita: toggle de tema + usuário -->
                <div class="d-flex align-items-center gap-2">
                    <button id="theme-toggle" class="btn btn-sm btn-outline-light theme-toggle" title="Alternar tema">
                        <i class="fas fa-moon"></i>
                    </button>

                    <ul class="navbar-nav">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                               data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fas fa-user me-1"></i>
                                <span sec:authentication="name">Usuário</span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                                <li><a class="dropdown-item" href="#" th:href="@{/perfil}">
                                    <i class="fas fa-user-edit me-1"></i>Meu Perfil
                                </a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <form th:action="@{/logout}" method="post" class="d-inline">
                                        <button type="submit" class="dropdown-item">
                                            <i class="fas fa-sign-out-alt me-1"></i>Logout
                                        </button>
                                    </form>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
</body>
</html>
