<!-- Sidebar (Thymeleaf fragment) -->
<aside xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml"
       th:fragment="sidebar(uri)"
       class="px-sidebar" aria-label="Menu lateral">

  <div class="px-header">
      <a th:href="@{/home}" class="px-logo-link">
          <!-- Seu logo aqui, se desejar -->
      </a>
      <button id="pxSidebarToggle" class="px-toggle" type="button" title="Recolher/Expandir">
          <i class="fas fa-angle-double-left"></i>
      </button>
  </div>

  <nav class="px-nav">
    <ul class="px-menu">

      <!-- Dashboard -->
      <li>
        <a class="px-link"
           th:href="@{/home}"
           th:classappend="${uri != null and uri == '/home' ? ' is-active' : ''}"
           title="Dashboard">
          <i class="px-ico fas fa-th-large"></i>
          <span class="px-text">Dashboard</span>
        </a>
      </li>

      <!-- Animais -->
      <li>
        <a class="px-link"
           th:href="@{/animais}"
           th:classappend="${uri != null and #strings.startsWith(uri,'/animais') ? ' is-active' : ''}"
           title="Animais">
          <i class="px-ico fas fa-paw"></i>
          <span class="px-text">Animais</span>
        </a>
      </li>

      <!-- Clínica — em breve -->
      <li>
        <a class="px-link px-link--soon"
           href="#"
           title="Clínica — Em breve">
          <i class="px-ico fas fa-stethoscope"></i>
          <span class="px-text">Clínica</span>
          <span class="px-badge">Em breve</span>
        </a>
      </li>

      <!-- Estoque -->
      <li>
        <a class="px-link"
           th:href="@{/estoque}"
           th:classappend="${uri != null and #strings.startsWith(uri,'/estoque') ? ' is-active' : ''}"
           title="Estoque">
          <i class="px-ico fas fa-box-open"></i>
          <span class="px-text">Estoque</span>
        </a>
      </li>

      <!-- Financeiro -->
      <li>
        <a class="px-link"
           th:href="@{/financeiro}"
           th:classappend="${uri != null and #strings.startsWith(uri,'/financeiro') ? ' is-active' : ''}"
           title="Financeiro">
          <i class="px-ico fas fa-wallet"></i>
          <span class="px-text">Financeiro</span>
        </a>
      </li>

      <!-- Tutores -->
      <li>
        <a class="px-link"
           th:href="@{/tutores}"
           th:classappend="${uri != null and #strings.startsWith(uri,'/tutores') ? ' is-active' : ''}"
           title="Tutores">
          <i class="px-ico fas fa-user-friends"></i>
          <span class="px-text">Tutores</span>
        </a>
      </li>

      <!-- Boletins -->
      <li>
        <a class="px-link"
           th:href="@{/boletins}"
           th:classappend="${uri != null and #strings.startsWith(uri,'/boletins') ? ' is-active' : ''}"
           title="Boletins de Resgate">
          <i class="px-ico fas fa-clipboard-list"></i>
          <span class="px-text">Boletins</span>
        </a>
      </li>

      <!-- Relatórios (Admin) -->
      <li sec:authorize="hasRole('ADMIN')">
        <a class="px-link"
           th:href="@{/admin/relatorios}"
           th:classappend="${uri != null and #strings.startsWith(uri,'/admin/relatorios') ? ' is-active' : ''}"
           title="Relatórios">
          <i class="px-ico fas fa-chart-bar"></i>
          <span class="px-text">Relatórios</span>
        </a>
      </li>

      <!-- Configurações (Admin) -->
      <li sec:authorize="hasRole('ADMIN')">
        <a class="px-link"
           th:href="@{/admin/configuracoes}"
           th:classappend="${uri != null and #strings.startsWith(uri,'/admin/configuracoes') ? ' is-active' : ''}"
           title="Configurações">
          <i class="px-ico fas fa-cog"></i>
          <span class="px-text">Configurações</span>
        </a>
      </li>

      <!-- Obituário — em breve -->
      <li>
        <a class="px-link px-link--soon"
           href="#"
           title="Obituário — Em breve">
          <i class="px-ico fas fa-cross"></i>
          <span class="px-text">Obituário</span>
          <span class="px-badge">Em breve</span>
        </a>
      </li>

      <!-- Doadores — em breve -->
      <li>
        <a class="px-link px-link--soon"
           href="#"
           title="Doadores — Em breve">
          <i class="px-ico fas fa-hand-holding-heart"></i>
          <span class="px-text">Doadores</span>
          <span class="px-badge">Em breve</span>
        </a>
      </li>

    </ul>
  </nav>

  <div class="px-shortcuts">

    </div>
  </div> -->
