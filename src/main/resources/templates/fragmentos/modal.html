<th:block th:fragment="modal(id, titulo, action, method, objeto, campos)">
  <div class="modal fade" th:id="${id}" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <form class="modal-content"
            th:action="${action}"
            method="post"
            th:object="${objeto}">
        <div class="modal-header">
          <h5 class="modal-title" th:text="${titulo}">Título</h5>
          <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>

        <div class="modal-body">
          <input type="hidden" name="_method"
                 th:if="${method != null and method.toLowerCase() != 'post'}"
                 th:value="${method}">
          <!-- SLOT de campos: vai herdar o th:object do form -->
          <div th:insert="${campos}"></div>
        </div>

        <div class="modal-footer">
          <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-primary" type="submit">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</th:block>
