<!-- templates/fragmentos/modal.html -->


<th:block xmlns:th="http://www.thymeleaf.org"
          th:fragment="modal(id, titulo, action, objeto, method='POST')">

  <div class="modal fade" th:id="${id}" tabindex="-1" aria-hidden="true" th:aria-labelledby="${id + '_label'}">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <form class="modal-content" th:action="${action}" th:object="${objeto}" method="post">

        <!-- Override de método (PUT/DELETE/...) -->
        <input type="hidden" name="_method"
               th:if="${method != null and method.toUpperCase() != 'POST'}"
               th:value="${method}" />

        <!-- CSRF (se houver) -->
        <input type="hidden" th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="modal-header">
          <h5 class="modal-title" th:id="${id + '_label'}" th:text="${titulo}">Editar</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>

        <div class="modal-body">
          <!-- Campos -->
          <div th:replace="~{tutores/form-campos :: campos}"></div>
        </div>

        <div class="modal-footer">
          <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-primary" type="submit">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</th:block>
