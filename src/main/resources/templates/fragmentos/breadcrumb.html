<!--
  Fragmento para Breadcrumb
  Uso: th:replace="~{fragmentos/breadcrumb :: breadcrumb(${breadcrumbItems})}"

  Exemplo de uso:
  th:with="breadcrumbItems=${{'Dashboard': '/dashboard', 'Animais': null}}"
  th:replace="~{fragmentos/breadcrumb :: breadcrumb(${breadcrumbItems})}"
-->
<nav xmlns:th="http://www.thymeleaf.org" th:fragment="breadcrumb" aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
        <li class="breadcrumb-item">
            <a th:href="@{/dashboard}" class="text-decoration-none">
                <i class="fas fa-home me-1"></i>Dashboard
            </a>
        </li>
        <li class="breadcrumb-item active" aria-current="page">
            <i class="fas fa-paw me-1"></i>Animais
        </li>
    </ol>
</nav>
