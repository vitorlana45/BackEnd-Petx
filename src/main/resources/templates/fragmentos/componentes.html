<!-- Card de Estatísticas -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="stat-card(icon, value, label, color)"
     class="card stat-card h-100 border-0 shadow-sm" th:classappend="${'bg-' + color + '-subtle border-' + color + '-subtle'}"
     data-aos="fade-up">
    <div class="card-body p-4">
        <div class="d-flex align-items-center mb-3">
            <div th:class="${'stat-icon bg-' + color + '-subtle text-' + color}" aria-hidden="true">
                <i th:class="${'fas fa-' + icon}"></i>
            </div>
            <div class="ms-auto small text-muted">
                <i class="fas fa-arrow-up me-1 text-success"></i>
                <span>12%</span>
            </div>
        </div>
        <h3 class="stat-value mb-1" th:text="${value}">0</h3>
        <p class="stat-label mb-0" th:text="${label}">Rótulo</p>
    </div>
</div>
<!-- Card de Ação Rápida -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="action-card(title, description, link, icon)"
     class="card h-100 border-0 shadow-sm action-card" data-aos="fade-up">
    <div class="card-body p-4">
        <div class="action-icon mb-3">
            <i th:class="${'fas fa-' + icon}"></i>
        </div>
        <h5 class="card-title" th:text="${title}">Título</h5>
        <p class="card-text text-muted" th:text="${description}">Descrição</p>
    </div>
    <div class="card-footer bg-transparent border-0 pb-4 px-4">
        <a th:href="${link}" class="btn btn-sm btn-primary btn-icon stretched-link">
            <span>Acessar</span>
            <i class="fas fa-arrow-right ms-1"></i>
        </a>
    </div>
</div>
<!-- Card de Alerta/Notificação -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="alert-card(title, message, type, icon)"
     class="card border-0 shadow-sm mb-4" th:classappend="${'bg-' + type + '-subtle border-' + type + '-subtle'}"
     data-aos="fade-up">
    <div class="card-body p-4">
        <div class="d-flex">
            <div th:class="${'alert-icon me-3 text-' + type}">
                <i th:class="${'fas fa-' + icon + ' fa-2x'}"></i>
            </div>
            <div>
                <h5 class="card-title" th:text="${title}">Título do Alerta</h5>
                <p class="card-text mb-0" th:text="${message}">Mensagem do alerta.</p>
            </div>
            <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>
    </div>
</div>
<!-- Tabela Estilizada -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="styled-table(headers, id)">
    <div class="card border-0 shadow-sm overflow-hidden">
        <div class="card-header bg-transparent py-3">
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="mb-0 card-title">Listagem de Registros</h5>
                <div class="d-flex gap-2">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-transparent border-end-0">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 ps-0"
                               th:attr="data-table-filter=${id}"
                               placeholder="Pesquisar...">
                    </div>
                    <button class="btn btn-sm btn-primary">
                        <i class="fas fa-plus me-1"></i>
                        <span>Adicionar</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover mb-0" th:id="${id}">
                <thead>
                    <tr>
                        <th scope="col" th:each="header : ${headers}" th:text="${header}">Cabeçalho</th>
                        <th scope="col" class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- O conteúdo da tabela será inserido dinamicamente -->
                    <tr>
                        <td colspan="100%" class="text-center py-4">
                            <div class="py-5">
                                <i class="fas fa-database text-muted mb-3 fa-2x"></i>
                                <p class="mb-0 text-muted">Nenhum registro encontrado</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-transparent border-top-0 py-3">
            <div class="d-flex justify-content-between align-items-center">
                <div class="text-muted small">Exibindo <span class="fw-medium">0</span> registros</div>
                <nav aria-label="Paginação">
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item disabled">
                            <a class="page-link" href="#" aria-label="Anterior">
                                <i class="fas fa-chevron-left"></i>
                            </a>
                        </li>
                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                        <li class="page-item">
                            <a class="page-link" href="#" aria-label="Próximo">
                                <i class="fas fa-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>
<!-- Card de Status do Pet -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="pet-status-card(pet)" class="card border-0 shadow-sm h-100" data-aos="fade-up">
    <div class="card-body p-0">
        <div class="d-flex align-items-center p-3 border-bottom">
            <div class="pet-avatar me-3" th:classappend="${'bg-' + (pet.especie == 'CACHORRO' ? 'dog' : (pet.especie == 'GATO' ? 'cat' : 'other')) + '-subtle'}">
                <i class="fas" th:classappend="${pet.especie == 'CACHORRO' ? 'fa-dog' : (pet.especie == 'GATO' ? 'fa-cat' : 'fa-paw')}"></i>
            </div>
            <div>
                <h6 class="mb-0 fw-semibold" th:text="${pet.nome}">Nome do Pet</h6>
                <div class="d-flex align-items-center">
                    <span class="badge" th:classappend="${'badge-' + (pet.especie == 'CACHORRO' ? 'dog' : (pet.especie == 'GATO' ? 'cat' : 'other'))}"
                          th:text="${pet.especie}">Espécie</span>
                    <span class="badge bg-secondary ms-1" th:text="${pet.porte}">Porte</span>
                </div>
            </div>
            <div class="ms-auto text-end">
                <div class="d-flex align-items-center justify-content-end">
                    <span class="status-indicator" th:classappend="${'status-' + (pet.status == 'ATIVO' ? 'active' : (pet.status == 'PENDENTE' ? 'pending' : 'inactive'))}"></span>
                    <span class="small" th:text="${pet.status}">Status</span>
                </div>
            </div>
        </div>
        <div class="p-3">
            <div class="mb-3">
                <div class="d-flex justify-content-between mb-1">
                    <span class="text-muted small">Raça:</span>
                    <span class="small fw-medium" th:text="${pet.raca}">Raça</span>
                </div>
                <div class="d-flex justify-content-between mb-1">
                    <span class="text-muted small">Idade:</span>
                    <span class="small fw-medium" th:text="${pet.idade}">Idade</span>
                </div>
                <div class="d-flex justify-content-between">
                    <span class="text-muted small">Tutor:</span>
                    <span class="small fw-medium" th:text="${pet.tutor}">Tutor</span>
                </div>
            </div>
            <div class="d-grid gap-2">
                <a href="#" th:href="@{'/animais/' + ${pet.id}}" class="btn btn-sm btn-outline-primary">
                    <i class="fas fa-eye me-1"></i>Ver Detalhes
                </a>
            </div>
        </div>
    </div>
</div>
