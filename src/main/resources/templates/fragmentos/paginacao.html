
<!-- templates/fragmentos/paginacao.html -->
<nav xmlns:th="http://www.thymeleaf.org"
     th:fragment="pagination(page, baseUrl, queryString, isHtmx, targetId)"
     class="pagination-container"
     th:if="${page.totalPages > 0}"
     th:aria-label="#{acessibilidade.navegacaoPaginas}"
     th:attr="hx-target=${isHtmx} ? ${'#' + targetId} : null,
              hx-swap=${isHtmx} ? 'outerHTML' : null">
    <div class="d-flex flex-column flex-md-row flex-wrap justify-content-between align-items-md-center gap-2 w-100">

        <div class="pagination-info small text-muted" role="status" aria-live="polite">
            <th:block th:text="#{paginacao.mostrando}">Mostrando</th:block>
            <span class="fw-medium" th:text="${page.numberOfElements}">0</span>
            <th:block th:text="#{paginacao.de}">de</th:block>
            <span class="fw-medium" th:text="${page.totalElements}">0</span>
            <th:block th:text="#{paginacao.registros}">registros</th:block>
            <span th:if="${page.totalElements > 0}">
        (<th:block th:text="#{paginacao.pagina}">Página</th:block>
        <span class="fw-medium" th:text="${page.number + 1}">1</span>
        <th:block th:text="#{ .de}">de</th:block>
        <span class="fw-medium" th:text="${page.totalPages}">1</span>)
      </span>
        </div>

        <div class="pagination-actions overflow-auto" th:if="${page.totalPages > 1}">
            <ul class="pagination pagination-sm mb-0">

                <!-- Primeira -->
                <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                    <a class="page-link"
                       th:href="|${baseUrl}?page=0&size=${page.size}${queryString}|"
                       th:attr="hx-get=|${baseUrl}?page=0&size=${page.size}${queryString}|,
                      hx-push-url=${isHtmx} ? 'true' : null"
                       th:aria-label="#{paginacao.primeira}"
                       th:aria-disabled="${page.first}">
                        <i class="fas fa-angle-double-left" aria-hidden="true"></i>
                        <span class="visually-hidden" th:text="#{paginacao.primeira}">Primeira</span>
                    </a>
                </li>

                <!-- Anterior -->
                <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                    <a class="page-link"
                       th:href="|${baseUrl}?page=${page.number - 1}&size=${page.size}${queryString}|"
                       th:attr="hx-get=|${baseUrl}?page=${page.number - 1}&size=${page.size}${queryString}|,
                      hx-push-url=${isHtmx} ? 'true' : null"
                       th:aria-label="#{paginacao.anterior}" rel="prev"
                       th:aria-disabled="${page.first}">
                        <i class="fas fa-angle-left" aria-hidden="true"></i>
                        <span class="visually-hidden" th:text="#{paginacao.anterior}">Anterior</span>
                    </a>
                </li>

                <!-- Janela -->
                <th:block th:with="start=${page.number - 2 < 0 ? 0 : page.number - 2},
                           end=${page.number + 2 >= page.totalPages ? page.totalPages - 1 : page.number + 2}">
                    <li class="page-item" th:each="i : ${#numbers.sequence(start, end)}"
                        th:classappend="${i == page.number} ? 'active'">
                        <a class="page-link"
                           th:text="${i + 1}"
                           th:href="${i == page.number} ? '#'
                        : |${baseUrl}?page=${i}&size=${page.size}${queryString}|"
                           th:attr="hx-get=${i == page.number} ? null : |${baseUrl}?page=${i}&size=${page.size}${queryString}|,
                        hx-push-url=${isHtmx and i != page.number} ? 'true' : null"
                           th:aria-current="${i == page.number ? 'page' : 'false'}"
                           th:aria-label="#{paginacao.irPara} + ' ' + ${i + 1}">1</a>
                    </li>
                </th:block>

                <!-- Próxima -->
                <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                    <a class="page-link"
                       th:href="|${baseUrl}?page=${page.number + 1}&size=${page.size}${queryString}|"
                       th:attr="hx-get=|${baseUrl}?page=${page.number + 1}&size=${page.size}${queryString}|,
                      hx-push-url=${isHtmx} ? 'true' : null"
                       th:aria-label="#{paginacao.proxima}" rel="next"
                       th:aria-disabled="${page.last}">
                        <i class="fas fa-angle-right" aria-hidden="true"></i>
                        <span class="visually-hidden" th:text="#{paginacao.proxima}">Próxima</span>
                    </a>
                </li>

                <!-- Última -->
                <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                    <a class="page-link"
                       th:href="|${baseUrl}?page=${page.totalPages - 1}&size=${page.size}${queryString}|"
                       th:attr="hx-get=|${baseUrl}?page=${page.totalPages - 1}&size=${page.size}${queryString}|,
                      hx-push-url=${isHtmx} ? 'true' : null"
                       th:aria-label="#{paginacao.ultima}"
                       th:aria-disabled="${page.last}">
                        <i class="fas fa-angle-double-right" aria-hidden="true"></i>
                        <span class="visually-hidden" th:text="#{paginacao.ultima}">Última</span>
                    </a>
                </li>

            </ul>
        </div>
    </div>
</nav>
