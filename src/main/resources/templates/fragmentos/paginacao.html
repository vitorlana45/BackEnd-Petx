<!-- Fragmento de paginação reutilizável
     Uso: th:replace="~{fragmentos/paginacao :: pagination(${page}, '/animais', ${filtrosQuery})}"
     Parâmetros:
       - page: objeto Page
    - baseUrl: caminho base (ex: '/animais')
    - queryParams: string já iniciando com '&' contendo filtros e (opcional) sort=campo,dir ou vazia
-->
<nav xmlns:th="http://www.thymeleaf.org"
     th:fragment="pagination(page, baseUrl, queryParams)"
     class="pagination-container"
     th:if="${page.totalPages > 0}"
     th:aria-label="#{acessibilidade.navegacaoPaginas}">

    <div class="d-flex flex-column flex-md-row flex-wrap justify-content-between align-items-md-center gap-2 w-100">
        <div class="pagination-info small text-muted" role="status" aria-live="polite">
            <th:block th:text="#{paginacao.mostrando}">Mostrando</th:block> <span class="fw-medium" th:text="${page.numberOfElements}">0</span>
            <th:block th:text="#{paginacao.de}">de</th:block> <span class="fw-medium" th:text="${page.totalElements}">0</span> <th:block th:text="#{paginacao.registros}">registros</th:block>
            <span th:if="${page.totalElements > 0}">
                (<th:block th:text="#{paginacao.pagina}">Página</th:block> <span class="fw-medium" th:text="${page.number + 1}">1</span>
                <th:block th:text="#{paginacao.de}">de</th:block> <span class="fw-medium" th:text="${page.totalPages}">1</span>)
            </span>
        </div>

        <div class="pagination-actions overflow-auto" th:if="${page.totalPages > 1}">
            <ul class="pagination pagination-sm mb-0">
                <!-- Primeira / Anterior -->
                <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                    <a class="page-link" 
                       th:href="${page.first ? '#' : baseUrl + '?page=0&size=' + page.size + (queryParams != null ? #strings.replace(queryParams, '&amp;', '&') : '')}" 
                       th:aria-label="#{paginacao.primeira}"
                       th:aria-disabled="${page.first}">
                        <i class="fas fa-angle-double-left" aria-hidden="true"></i>
                        <span class="visually-hidden" th:text="#{paginacao.primeira}">Primeira página</span>
                    </a>
                </li>
                <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                    <a class="page-link" 
                       th:href="${page.first ? '#' : baseUrl + '?page=' + (page.number - 1) + '&size=' + page.size + (queryParams != null ? #strings.replace(queryParams, '&amp;', '&') : '')}" 
                       th:aria-label="#{paginacao.anterior}"
                       rel="prev"
                       th:aria-disabled="${page.first}">
                        <i class="fas fa-angle-left" aria-hidden="true"></i>
                        <span class="visually-hidden" th:text="#{paginacao.anterior}">Página anterior</span>
                    </a>
                </li>

                <!-- Janela dinâmica de até 5 páginas -->
                <th:block th:with="start=${page.number - 2 < 0 ? 0 : page.number - 2},
                                      end=${page.number + 2 >= page.totalPages ? page.totalPages - 1 : page.number + 2}">
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(start, end)}"
                        th:classappend="${i == page.number} ? 'active'">
                        <a class="page-link" 
                           th:text="${i + 1}"
                           th:href="${i == page.number ? '#' : baseUrl + '?page=' + i + '&size=' + page.size + (queryParams != null ? #strings.replace(queryParams, '&amp;', '&') : '')}"
                           th:aria-current="${i == page.number ? 'page' : 'false'}"
                           th:aria-label="#{paginacao.irPara} + ' ' + ${i + 1}">1</a>
                    </li>
                </th:block>

                <!-- Próxima / Última -->
                <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                    <a class="page-link" 
                       th:href="${page.last ? '#' : baseUrl + '?page=' + (page.number + 1) + '&size=' + page.size + (queryParams != null ? #strings.replace(queryParams, '&amp;', '&') : '')}" 
                       th:aria-label="#{paginacao.proxima}"
                       rel="next"
                       th:aria-disabled="${page.last}">
                        <i class="fas fa-angle-right" aria-hidden="true"></i>
                        <span class="visually-hidden" th:text="#{paginacao.proxima}">Próxima página</span>
                    </a>
                </li>
                <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                    <a class="page-link" 
                       th:href="${page.last ? '#' : baseUrl + '?page=' + (page.totalPages - 1) + '&size=' + page.size + (queryParams != null ? #strings.replace(queryParams, '&amp;', '&') : '')}" 
                       th:aria-label="#{paginacao.ultima}"
                       th:aria-disabled="${page.last}">
                        <i class="fas fa-angle-double-right" aria-hidden="true"></i>
                        <span class="visually-hidden" th:text="#{paginacao.ultima}">Última página</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
