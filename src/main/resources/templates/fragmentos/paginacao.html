<!-- Fragmento de paginação reutilizável
     Uso: th:replace="~{fragmentos/paginacao :: pagination(${page}, '/animais', ${filtrosQuery})}"
     Parâmetros:
       - page: objeto Page
       - baseUrl: caminho base (ex: '/animais')
       - queryParams: string já iniciando com '&' contendo filtros (ex: '&nome=Rex&status=ATIVO') ou vazia
-->
<nav xmlns:th="http://www.thymeleaf.org"
     th:fragment="pagination(page, baseUrl, queryParams)"
     class="pagination-container"
     th:if="${page.totalPages > 0}">

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 w-100">
        <div class="pagination-info small text-muted">
            Mostrando <span class="fw-medium" th:text="${page.numberOfElements}">0</span>
            de <span class="fw-medium" th:text="${page.totalElements}">0</span> registros
            <span th:if="${page.totalElements > 0}">
                (Página <span class="fw-medium" th:text="${page.number + 1}">1</span>
                de <span class="fw-medium" th:text="${page.totalPages}">1</span>)
            </span>
        </div>

        <div class="pagination-actions" th:if="${page.totalPages > 1}">
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                    <a class="page-link" th:href="${baseUrl + '?page=0&size=' + page.size + (queryParams != null ? queryParams : '')}" aria-label="Primeira">
                        <i class="fas fa-angle-double-left"></i>
                    </a>
                </li>
                <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                    <a class="page-link" th:href="${baseUrl + '?page=' + (page.number - 1) + '&size=' + page.size + (queryParams != null ? queryParams : '')}" aria-label="Anterior">
                        <i class="fas fa-angle-left"></i>
                    </a>
                </li>
                <li class="page-item"
                    th:each="i : ${#numbers.sequence(page.number > 2 ? page.number - 2 : 0, page.number + 2 < page.totalPages ? page.number + 2 : page.totalPages - 1)}"
                    th:classappend="${i == page.number} ? 'active'">
                    <a class="page-link" th:text="${i + 1}"
                       th:href="${baseUrl + '?page=' + i + '&size=' + page.size + (queryParams != null ? queryParams : '')}">1</a>
                </li>
                <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                    <a class="page-link" th:href="${baseUrl + '?page=' + (page.number + 1) + '&size=' + page.size + (queryParams != null ? queryParams : '')}" aria-label="Próxima">
                        <i class="fas fa-angle-right"></i>
                    </a>
                </li>
                <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                    <a class="page-link" th:href="${baseUrl + '?page=' + (page.totalPages - 1) + '&size=' + page.size + (queryParams != null ? queryParams : '')}" aria-label="Última">
                        <i class="fas fa-angle-double-right"></i>
                    </a>
                </li>
            </ul>
        </div>

        <div class="pagination-size-selector d-flex align-items-center ms-md-3">
            <label for="pageSizeSelect" class="small text-muted me-2 mb-0">Itens por página:</label>
            <select id="pageSizeSelect" class="form-select form-select-sm" style="width: auto"
                    onchange="window.location.href=this.value">
                <option th:each="size : ${T(java.util.Arrays).asList(10,20,50,100)}"
                        th:value="${baseUrl + '?page=0&size=' + size + (queryParams != null ? queryParams : '')}"
                        th:text="${size}"
                        th:selected="${size == page.size}">10</option>
            </select>
        </div>
    </div>

    <style>
        .pagination-container { width: 100%; padding: 0.5rem 0; }
        .pagination { margin-bottom: 0; }
        .page-link { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
        .page-item.active .page-link { background-color: var(--petx-primary, #4361ee); border-color: var(--petx-primary, #4361ee); }
    </style>
</nav>
