<!-- fragmentos/stat-cards.html -->
<div xmlns:th="http://www.thymeleaf.org">

  <!-- Card de estatística compacto -->
  <div th:fragment="stat-card(icon, value, label, delta, color, trend)"
       class="card h-100 border-0 shadow-sm"
       th:classappend="${' bg-' + color + '-subtle'}"
       aria-live="polite">
    <div class="card-body p-3 d-flex align-items-center gap-3">
      <div class="d-inline-flex justify-content-center align-items-center rounded-circle"
           th:classappend="${' text-' + color + ' bg-' + color + '-subtle'}"
           style="width:36px;height:36px">
        <i th:class="${icon}" aria-hidden="true"></i>
      </div>

      <div class="ms-auto text-end">
        <div class="fw-semibold lh-1" style="font-size:1.25rem"
             th:text="${value}">0</div>
        <div class="text-muted small" th:text="${label}">Label</div>
        <div class="d-flex align-items-center justify-content-end gap-1 small"
             th:if="${delta != null}">
          <i class="fas"
             th:classappend="${trend == 'up' ? ' fa-arrow-up text-success' :
                             (trend == 'down' ? ' fa-arrow-down text-danger' : ' fa-minus text-muted')}"></i>
          <span th:text="${delta}">0</span>
          <span class="text-muted">este mês</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Grid de estatísticas -->
  <div th:fragment="stats-grid(totalAnimais, totalAdocoes, totalTutores, totalBoletins, crescimentoMensal)"
       class="row g-3 mb-3">
    <div class="col-xl-3 col-md-6">
      <div th:replace="~{fragmentos/stat-cards :: stat-card(
           'fas fa-paw',
           ${totalAnimais ?: 0},
           'Total de Animais',
           ${crescimentoMensal?.novosAnimaisMes ?: 0},
           'primary',
           'up'
      )}"></div>
    </div>

    <div class="col-xl-3 col-md-6">
      <div th:replace="~{fragmentos/stat-cards :: stat-card(
           'fas fa-heart',
           ${totalAdocoes ?: 0},
           'Adoções Realizadas',
           ${crescimentoMensal?.adocoesMes ?: 0},
           'success',
           'up'
      )}"></div>
    </div>

    <div class="col-xl-3 col-md-6">
      <div th:replace="~{fragmentos/stat-cards :: stat-card(
           'fas fa-users',
           ${totalTutores ?: 0},
           'Tutores Cadastrados',
           ${crescimentoMensal?.novosTutoresMes ?: 0},
           'info',
           'up'
      )}"></div>
    </div>

    <div class="col-xl-3 col-md-6">
      <div th:replace="~{fragmentos/stat-cards :: stat-card(
           'fas fa-clipboard-list',
           ${totalBoletins ?: 0},
           'Boletins de Resgate',
           ${crescimentoMensal?.boletinsMes ?: 0},
           'warning',
           'up'
      )}"></div>
    </div>
  </div>

</div>
