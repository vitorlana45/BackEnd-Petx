<!--
  Fragmento para Cabeçalhos de Página
  Uso: th:replace="~{fragmentos/page-header :: page-header(title, description, icon, actions)}"
-->
<div xmlns:th="http://www.thymeleaf.org"
     th:fragment="page-header(title, description, icon, actions)"
     class="page-header d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1 class="page-title">
            <i th:if="${icon}" th:class="${'fas fa-' + icon + ' me-2 text-primary'}"></i>
            <span th:text="${title}">Título da Página</span>
        </h1>
        <p th:if="${description}" class="text-muted mb-0" th:text="${description}">Descrição da página</p>
    </div>
    <div th:if="${actions}" class="page-actions" th:utext="${actions}">
        <!-- Ações serão inseridas aqui -->
    </div>
</div>

<!-- Cabeçalho com estatísticas -->
<div xmlns:th="http://www.thymeleaf.org"
     th:fragment="stats-header(title, description, icon, stats)"
     class="page-header mb-4">
    <div class="row align-items-center">
        <div class="col-md-8">
            <h1 class="page-title">
                <i th:if="${icon}" th:class="${'fas fa-' + icon + ' me-2 text-primary'}"></i>
                <span th:text="${title}">Título da Página</span>
            </h1>
            <p th:if="${description}" class="text-muted mb-0" th:text="${description}">Descrição da página</p>
        </div>
        <div th:if="${stats}" class="col-md-4">
            <div class="row g-2 text-center">
                <div th:each="stat : ${stats}" class="col">
                    <div class="stat-item">
                        <div class="stat-number h4 mb-1" th:text="${stat.value}">0</div>
                        <div class="stat-label small text-muted" th:text="${stat.label}">Label</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Cabeçalho Simples -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="header" class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1><i class="fas fa-paw me-2 text-primary"></i>Animais</h1>
        <p class="text-muted mb-0">Gerencie todos os animais cadastrados</p>
    </div>
    <div>
        <a th:href="@{/animais/novo}" class="btn btn-primary">
            <i class="fas fa-plus me-2"></i>Novo Animal
        </a>
    </div>
</div>
