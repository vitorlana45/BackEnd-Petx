<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="selector">
    <div th:if="${ocorrenciasEncontradas == null}" class="small" style="color: var(--text-muted);">
        Use os filtros para buscar ocorrências.
    </div>

    <div th:if="${ocorrenciasEncontradas != null && #lists.isEmpty(ocorrenciasEncontradas)}" class="small" style="color: var(--text-muted);">
        Nenhuma ocorrência encontrada com os filtros informados.
    </div>

    <div th:if="${ocorrenciasEncontradas != null && !#lists.isEmpty(ocorrenciasEncontradas)}" class="table-responsive">
        <table class="table table-sm align-middle mb-0">
            <thead>
            <tr>
                <th style="width: 42px;"></th>
                <th>Nº</th>
                <th>Data</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${ocorrenciasEncontradas}">
                <td>
                    <input class="form-check-input" type="radio" name="numeroOcorrenciaSelecionada"
                           th:value="${b.numeroOcorrencia}"
                           th:checked="${numeroOcorrenciaSelecionada != null && numeroOcorrenciaSelecionada == b.numeroOcorrencia}">
                </td>
                <td class="fw-semibold" th:text="${b.numeroOcorrencia}">202500001</td>
                <td th:text="${b.dataAtendimento != null ? #temporals.format(b.dataAtendimento, 'dd/MM/yyyy HH:mm') : '—'}">—</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
