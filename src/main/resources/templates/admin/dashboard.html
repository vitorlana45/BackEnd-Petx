<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Painel Administrativo - PetX</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Painel Administrativo</h2>
        <span class="badge bg-danger">Apenas ADMIN</span>
    </div>

    <!-- Cards de estatísticas administrativas -->
    <div class="row mb-4 g-3">
        <div class="col-md-3">
            <div class="card h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <span class="d-flex align-items-center justify-content-center"
                          style="width:44px;height:44px;border-radius:.5rem;background:rgba(109,40,217,.12);color:var(--petx-primary);">
                        <i class="fas fa-users"></i>
                    </span>
                    <div>
                        <div class="text-muted small">Usuários</div>
                        <div class="h4 mb-0" th:text="${totalUsuarios}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <span class="d-flex align-items-center justify-content-center"
                          style="width:44px;height:44px;border-radius:.5rem;background:rgba(5,150,105,.12);color:var(--petx-success);">
                        <i class="fas fa-user-check"></i>
                    </span>
                    <div>
                        <div class="text-muted small">Ativos</div>
                        <div class="h4 mb-0" th:text="${usuariosAtivos}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <span class="d-flex align-items-center justify-content-center"
                          style="width:44px;height:44px;border-radius:.5rem;background:rgba(217,119,6,.12);color:var(--petx-warning);">
                        <i class="fas fa-user-slash"></i>
                    </span>
                    <div>
                        <div class="text-muted small">Inativos</div>
                        <div class="h4 mb-0" th:text="${usuariosInativos}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <span class="d-flex align-items-center justify-content-center"
                          style="width:44px;height:44px;border-radius:.5rem;background:rgba(79,70,229,.12);color:var(--petx-secondary);">
                        <i class="fas fa-building-ngo"></i>
                    </span>
                    <div>
                        <div class="text-muted small">ONGs</div>
                        <div class="h4 mb-0">5</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Ações rápidas -->
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5>Gestão de Usuários</h5>
                </div>
                <div class="card-body">
                    <p>Gerencie usuários, roles e permissões do sistema.</p>
                    <div class="d-grid gap-2">
                        <a href="/admin/usuarios" class="btn btn-primary">
                            <i class="fas fa-users me-2"></i>Ver Todos os Usuários
                        </a>
                        <a href="/admin/usuarios/novo" class="btn btn-success">
                            <i class="fas fa-user-plus me-2"></i>Criar Novo Usuário
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5>Relatórios e Análises</h5>
                </div>
                <div class="card-body">
                    <p>Acesse relatórios detalhados e estatísticas do sistema.</p>
                    <div class="d-grid gap-2">
                        <a href="/admin/relatorios" class="btn btn-info">
                            <i class="fas fa-chart-bar me-2"></i>Ver Relatórios
                        </a>
                        <a href="/admin/configuracoes" class="btn btn-secondary">
                            <i class="fas fa-cog me-2"></i>Configurações
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
