<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layouts/master :: layout(~{::title}, ~{::head}, ~{::content}, ~{::scripts})}"
      lang="pt-BR">

<!-- ============================================================================ -->
<!-- FORM LAYOUT - Layout específico para formulários                          -->
<!-- ============================================================================ -->

<head th:fragment="head">
    <!-- CSS específico para formulários -->
    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <link rel="stylesheet" th:href="@{/css/validation.css}">
</head>

<div th:fragment="content" class="form-layout">
    <!-- Header do Formulário -->
    <div class="form-header">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col">
                    <h1 class="form-title" th:text="${formTitle}">Formulário</h1>
                    <p class="form-description text-muted" th:text="${formDescription}" th:if="${formDescription}">
                        Descrição do formulário
                    </p>
                </div>
                <div class="col-auto">
                    <!-- Ações do formulário -->
                    <div class="form-actions">
                        <a th:href="${backUrl ?: 'javascript:history.back()'}" 
                           class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left me-2"></i>Voltar
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Conteúdo do Formulário -->
    <div class="form-content">
        <div class="container-fluid">
            <div class="row justify-content-center">
                <div th:class="${formWidth ?: 'col-lg-8'}">
                    <!-- Card do Formulário -->
                    <div class="card form-card">
                        <div class="card-body">
                            <!-- Conteúdo específico do formulário -->
                            <div th:replace="${formContent}">
                                <!-- Formulário será inserido aqui -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:fragment="scripts">
    <!-- Scripts específicos para formulários -->
    <script th:replace="~{layouts/fragments/scripts :: form-scripts}"></script>
    <script th:replace="~{layouts/fragments/scripts :: csrf-config}"></script>
</th:block>

</html>
