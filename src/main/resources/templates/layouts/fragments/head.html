<th:block xmlns:th="http://www.thymeleaf.org">

<!-- ============================================================================ -->
<!-- HEAD MASTER FRAGMENT - Gerencia todos os recursos <head> da aplicação      -->
<!-- ============================================================================ -->

<head th:fragment="head(title, additionalHead)">
    <!-- Meta Tags Essenciais -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de gestão para abrigos de animais - ONG PetX">
    <meta name="keywords" content="ONG, animais, pets, adoção, abrigo, veterinário">
    <meta name="author" content="ONG PetX">
    <meta name="robots" content="index, follow">
    
    <!-- Theme e SEO -->
    <meta name="theme-color" content="#4361ee">
    <meta name="msapplication-TileColor" content="#4361ee">
    
    <!-- Título Dinâmico -->
    <title th:text="${title != null ? title + ' | PetX' : 'PetX - Sistema de Gestão de Animais'}">
        PetX - Sistema de Gestão
    </title>
    
    <!-- CSRF Token para requisições AJAX -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">

    <!-- Aplicar tema antes do CSS para evitar flash -->
    <script th:replace="~{layouts/fragments/head :: theme-init}"></script>

    <!-- Preload Critical Resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" as="style">
    
    <!-- Core CSS - Ordem específica para cascading correto -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous" referrerpolicy="no-referrer">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Animation Libraries -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- CSS Customizado - Ordem hierárquica -->
    <link rel="stylesheet" th:href="@{/css/variables.css}">      <!-- Variáveis CSS primeiro -->
    <link rel="stylesheet" th:href="@{/css/base.css}">          <!-- Estilos base -->
    <link rel="stylesheet" th:href="@{/css/components.css}">    <!-- Componentes -->
    <link rel="stylesheet" th:href="@{/css/layouts.css}">       <!-- Layouts -->
    <link rel="stylesheet" th:href="@{/css/pages.css}">         <!-- Páginas específicas -->
    <link rel="stylesheet" th:href="@{/css/utilities.css}">     <!-- Utilities e overrides -->
    
    <!-- Favicon e Icons -->
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/images/apple-touch-icon.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/images/favicon-16x16.png}">
    <link rel="manifest" th:href="@{/manifest.json}">
    
    <!-- CSS Adicional específico da página -->
    <th:block th:replace="${additionalHead}"></th:block>
</head>

<!-- ============================================================================ -->
<!-- THEME INITIALIZATION SCRIPT - Aplicado antes do CSS                        -->
<!-- ============================================================================ -->
<script th:fragment="theme-init">
    (function() {
        'use strict';
        try {
            // Recupera tema salvo ou define padrão
            const savedTheme = localStorage.getItem('petx-theme') || 'light';
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme === 'auto' ? (prefersDark ? 'dark' : 'light') : savedTheme;
            
            // Aplica tema imediatamente
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.classList.add('theme-' + theme);
            
            // Define variável global
            window.PETX_THEME = theme;
        } catch (error) {
            console.warn('Erro ao carregar tema:', error);
            document.documentElement.setAttribute('data-theme', 'light');
        }
    })();
</script>

<!-- ============================================================================ -->
<!-- HEAD VARIANTS - Para diferentes tipos de página                            -->
<!-- ============================================================================ -->

<!-- Head para páginas de dashboard/admin -->
<head th:fragment="head-dashboard(title)">
    <th:block th:replace="~{layouts/fragments/head :: head(${title}, ~{:: dashboard-css})}"></th:block>
    <th:block th:ref="dashboard-css">
        <link rel="stylesheet" th:href="@{/css/dashboard.css}">
        <link rel="stylesheet" th:href="@{/css/charts.css}">
    </th:block>
</head>

<!-- Head para páginas públicas -->
<head th:fragment="head-public(title)">
    <th:block th:replace="~{layouts/fragments/head :: head(${title}, ~{:: public-css})}"></th:block>
    <th:block th:ref="public-css">
        <link rel="stylesheet" th:href="@{/css/public.css}">
    </th:block>
</head>

<!-- Head para formulários complexos -->
<head th:fragment="head-forms(title)">
    <th:block th:replace="~{layouts/fragments/head :: head(${title}, ~{:: forms-css})}"></th:block>
    <th:block th:ref="forms-css">
        <link rel="stylesheet" th:href="@{/css/forms.css}">
        <link rel="stylesheet" th:href="@{/css/validation.css}">
    </th:block>
</head>

</th:block>
