<th:block xmlns:th="http://www.thymeleaf.org">

<!-- ============================================================================ -->
<!-- SCRIPTS MASTER FRAGMENT - Gerenciamento de JavaScript modular              -->
<!-- ============================================================================ -->

<th:block th:fragment="base-scripts">
    <!-- Bootstrap JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" 
            crossorigin="anonymous"></script>

    <!-- Animation Library -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- Core PetX JavaScript -->
    <script th:src="@{/js/core/app.js}"></script>
    <script th:src="@{/js/core/theme.js}"></script>
    <script th:src="@{/js/core/notifications.js}"></script>
    <script th:src="@{/js/core/utils.js}"></script>

    <!-- Componentes JavaScript -->
    <script th:src="@{/js/components/modals.js}"></script>
    <script th:src="@{/js/components/forms.js}"></script>
    <script th:src="@{/js/components/tables.js}"></script>
    <script th:src="@{/js/components/charts.js}"></script>

    <!-- Inicialização da Aplicação -->
    <script th:replace="~{layouts/fragments/scripts :: app-init}"></script>
</th:block>

<!-- ============================================================================ -->
<!-- INICIALIZAÇÃO DA APLICAÇÃO                                                 -->
<!-- ============================================================================ -->

<script th:fragment="app-init">
document.addEventListener('DOMContentLoaded', function() {
    'use strict';
    
    try {
        // Inicializar AOS (Animate on Scroll)
        if (typeof AOS !== 'undefined') {
            AOS.init({
                duration: 800,
                easing: 'ease-out-cubic',
                once: true,
                offset: 100,
                disable: 'mobile'
            });
        }

        // Inicializar componentes PetX
        if (window.PetX) {
            window.PetX.init();
        }

        // Remover loader após carregamento completo
        const loader = document.getElementById('global-loader');
        if (loader) {
            setTimeout(() => {
                loader.classList.add('fade-out');
                setTimeout(() => loader.remove(), 300);
            }, 500);
        }

        // Inicializar tooltips do Bootstrap
        const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl);
        });

        // Inicializar popovers do Bootstrap
        const popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'));
        popoverTriggerList.map(function (popoverTriggerEl) {
            return new bootstrap.Popover(popoverTriggerEl);
        });

        console.log('✅ PetX Application initialized successfully');
    } catch (error) {
        console.error('❌ Error initializing PetX Application:', error);
    }
});
</script>

<!-- Script de configuração CSRF para AJAX -->
<script th:fragment="csrf-config">
$(document).ready(function() {
    // Configurar CSRF para todas as requisições AJAX
    const token = $('meta[name=_csrf]').attr('content');
    const header = $('meta[name=_csrf_header]').attr('content');
    
    if (token && header) {
        $(document).ajaxSend(function(e, xhr, options) {
            xhr.setRequestHeader(header, token);
        });
    }
});
</script>
