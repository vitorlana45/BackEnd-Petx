<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)"
      lang="pt-BR"
      data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de gestão para abrigos de animais e ONGs de proteção animal">
    <meta name="theme-color" content="#4361ee">
    <!-- CSRF Token para requisições AJAX -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">

    <!-- Aplicar tema salvo ANTES de carregar CSS para evitar flash -->
    <script>
        (function(){
            try {
                var t = localStorage.getItem('theme');
                if(t){ document.documentElement.setAttribute('data-theme', t); }
            } catch(e) {}
        })();
    </script>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
          crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS customizado - ordem importante para sobreposições corretas -->
    <link rel="stylesheet" th:href="@{/css/estilo.css}">                    <!-- 1. Base: variáveis e estilos globais -->
    <link rel="stylesheet" th:href="@{/css/components.css}">                <!-- 2. Componentes gerais -->
    <link rel="stylesheet" th:href="@{/css/components/smart-header.css}">   <!-- 3. Smart Header (padrão global) -->
    <link rel="stylesheet" th:href="@{/css/navigation.css}">                <!-- 4. Navegação específica -->
    <link rel="stylesheet" th:href="@{/css/animais.css}">                   <!-- 5. Página de animais -->
    <link rel="stylesheet" th:href="@{/css/resgates.css}">                  <!-- 6. Página de resgates -->
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">                 <!-- 7. Dashboard (overrides) -->

    <!-- Animation CSS - AOS Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <!-- Favicon -->
<!--    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">-->
    <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">
</head>
<body data-theme="light">
<header th:replace="~{fragmentos/menu :: menu}"></header>

<div class="app-shell">
    <!-- SIDEBAR -->
    <aside th:replace="~{fragmentos/sidebar :: sidebar(
            uri=${#uris}
    )}"></aside>

    <!-- CONTEÚDO -->
    <main class="app-content " id="main-content">
        <div class="container-max">
            <div th:replace="${content}" class="animate-fade-in"></div>
        </div>

<!--        <footer th:replace="~{fragmentos/rodape :: rodape}"></footer>-->

    </main>
</div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

    <!-- Animation JS Library -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- JavaScript customizado -->
    <script th:src="@{/js/script.js}"></script>

    <!-- Inicializar animações -->

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Anexa CSRF em toda requisição HTMX
        document.body.addEventListener('htmx:configRequest', (evt) => {
            const token  = document.querySelector('meta[name="_csrf"]')?.content;
            const header = document.querySelector('meta[name="_csrf_header"]')?.content;
            if (token && header) evt.detail.headers[header] = token;
        });

        // Ouça eventos enviados pelo servidor via HX-Trigger
        document.body.addEventListener('closeModal', (e) => {
            const id = e.detail?.id || 'editarPerfilModal';
            const el = document.getElementById(id);
            if (!el) return;
            const modal = bootstrap.Modal.getInstance(el) || new bootstrap.Modal(el);
            modal.hide();
        });

        document.body.addEventListener('toast', (e) => {
            // aqui você chama seu sistema de toast; por enquanto console:
            console.log(`[${e.detail?.type||'info'}] ${e.detail?.text||''}`);
        });
    });
</script>


    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Inicializar AOS animations
            AOS.init({
                duration: 800,
                easing: 'ease',
                once: true
            });


            var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
            var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
                return new bootstrap.Tooltip(tooltipTriggerEl);
            });

            // Configuração global para requisições AJAX com CSRF
            if (document.querySelector('meta[name="_csrf"]')) {
                const token = document.querySelector('meta[name="_csrf"]').getAttribute('content');
                const header = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

                // Configurar cabeçalhos CSRF para fetch API
                window.fetchWithCsrf = function(url, options = {}) {
                    options.headers = options.headers || {};
                    options.headers[header] = token;
                    return fetch(url, options);
                };
            }
        });
    </script>
</body>
</html>
