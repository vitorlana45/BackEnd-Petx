# Configurações de desenvolvimento para hot reload
spring.profiles.active=dev

# Thymeleaf - Configurações para desenvolvimento
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# DevTools - Habilita hot reload
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/resources/templates,src/main/resources/static

# Cache - Desabilitar em desenvolvimento
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true

# Logging para debug
logging.level.org.thymeleaf=DEBUG
logging.level.org.springframework.web=DEBUG

# SpringDoc OpenAPI 3 (Swagger) Configuration
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.filter=true
springdoc.show-actuator=false
springdoc.packages-to-scan=org.ong.pet.pex.backendpetx.controller
springdoc.paths-to-match=/api/**
